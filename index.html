  return'<div class="scroll"><table class="tbl sg"><thead><tr><th>Intern</th><th>First half</th><th></th><th>Second half</th><th>First half ends on day <span class="muted small">(usual '+halfDay(UI.sgYm)+')</span></th></tr></thead><tbody>'+rows+'</tbody></table></div><p class="hint">The on-call lists follow these choices. An intern doing Neurosurgery is placed on the Neurosurgery rota; any other subspecialty is on the Surgical rota; the Orthopedics half is on the Orthopedics rota. In the Google Sheet this is the month cell, for example “Urology /Ortho”.</p>';
}
function sgGs(ym,edit){
  const list=gsInterns(ym);
  if(!list.length)return emptyBox('No one is on General surgery in '+fmtYm(ym)+'.');
  const c=firmCounts(ym);
  const strip=[['a','First half'],['b','Second half']].map(([k,l])=>{const v=FIRMS.map(f=>c[k][f]),uneven=Math.max(...v)-Math.min(...v)>1;return'<div class="firmstrip'+(uneven?' warn':'')+'"><b>'+l+'</b> '+FIRMS.map(f=>'<span>Firm '+f+': <b>'+c[k][f]+'</b></span>').join(' ')+(uneven?' <span class="tag warn">uneven</span>':'')+'</div>';}).join('');
  const sel=(id,k,v)=>'<select data-gs="'+id+'" data-half="'+k+'" aria-label="Firm"'+(edit?'':' disabled')+'><option value="">Not set</option>'+FIRMS.map(f=>'<option value="'+f+'"'+(v===f?' selected':'')+'>Firm '+f+'</option>').join('')+'</select>';
  const rows=list.map(it=>{

const FLAG_TEXT={sick:'Sick leave',emergency:'Emergency leave',absent:'Absent'};
function flagOf(unit,date,id){const f=S.leaveFlags&&S.leaveFlags[ocKey(unit,ymOf(date))];return f&&f[dayKey(date)]&&f[dayKey(date)][id]||'';}
function flagTag(unit,date,id){const f=flagOf(unit,date,id);return f?' <span class="tag warn">'+esc(FLAG_TEXT[f]||f)+'</span>':'';}
function lastCallText(id,ym){
  const it=S.interns[id];if(!it)return'';
  const first=ym+'-01',all=shiftsOf(id,true),before=all.filter(s=>s.date<first),thisM=all.filter(s=>ymOf(s.date)===ym);

  if(!before.length)return'<span class="muted">None recorded.</span>'+ele;
  const last=before[before.length-1];let w='';
  if(thisM.length){const nx=thisM[0],diff=Math.abs(dayCount(last.date,nx.date)-1);if(diff<MIN_GAP)w=' <span class="tag warn">Next call '+fmtDate(nx.date)+', only '+(diff-1<0?0:diff-1)+' free day'+(diff-1===1?'':'s')+'</span>';}
  return fmtDate(last.date)+' <span class="muted">'+esc(UNIT_NAME[last.unit]||last.unit)+'</span>'+w+ele;
}
function ocWarnings(unit,ym){
  const out=[],n=dim(ym);
  const add=(sev,date,id,text)=>out.push({sev,date,id,text});
  for(let d=1;d<=n;d++){
    const date=ym+'-'+pad(d),rec=dayRec(unit,date);
    if(rec.need!=null&&rec.ids.length<rec.need)add(1,date,null,'Short of cover: '+rec.ids.length+' of '+rec.need+' interns.');
    rec.ids.forEach(id=>{
      const it=S.interns[id];if(!it)return;
      const f=flagOf(unit,date,id);
      if(f)add(1,date,id,(FLAG_TEXT[f]||f)+' on a call day. Cover may be needed, and this call does not count.');
      const lv=leaveReqs(id).find(r=>r.status==='approved'&&r.from<=date&&date<=r.to);
      if(lv&&lv.kind==='annual')add(1,date,id,'Has approved annual leave on a call day.');
      else if(lv&&!f)add(2,date,id,'Has approved '+(KIND_NAME[lv.kind]||'leave').toLowerCase()+' on a call day.');
      const pend=leaveReqs(id).find(r=>r.status!=='approved'&&r.status!=='declined'&&r.from<=date&&date<=r.to);
      if(pend)add(2,date,id,'Has a leave request on this day that is not decided yet.');
      const gap=gapClash(id,date,unit);
      if(gap&&gap.date<date)add(2,date,id,'Only '+Math.max(gap.diff-1,0)+' free day'+(gap.diff-1===1?'':'s')+' after the call on '+fmtDate(gap.date)+' ('+(UNIT_NAME[gap.unit]||gap.unit)+'). Two are needed.');
      if(rotaOf(placementAt(it,date,S.surgery[id]))!==unit)add(2,date,id,'Not placed in this rota on this date.');
    });
  }
  const seen={};
  Object.values(S.interns).forEach(it=>{
    const sh=shiftsOf(it.id).filter(s=>s.unit===unit&&ymOf(s.date)===ym);
    sh.forEach(s=>{
      const pc=periodCounts(it.id,s.date),max=pc.split?CFG.shiftHalfMax:CFG.shiftMonthMax,wkMax=pc.split?CFG.wkHalfWarn:CFG.wkMonthWarn,k=it.id+pc.pk;
      if(pc.total>max&&!seen['m'+k]){seen['m'+k]=1;add(2,s.date,it.id,'Over the on-call limit: '+pc.total+' of '+max+(pc.split?' in this half.':' this month.'));}
      if(pc.wk>wkMax&&!seen['w'+k]){seen['w'+k]=1;add(2,s.date,it.id,'Over the weekend and holiday limit: '+pc.wk+' of '+wkMax+'.');}
    });
  });
  return out.sort((a,b)=>a.sev-b.sev||(a.date<b.date?-1:1));
}

  const list=ocWarnings(unit,ym);
  return'<section class="panel"><h2>Warnings for '+fmtYm(ym)+' <span class="tag '+(list.length?'warn':'ok')+'">'+list.length+'</span></h2>'+
    (list.length?'<ul class="list">'+list.map(w=>'<li><span><b>'+fmtDate(w.date)+'</b> '+(w.id?internLink(w.id)+': ':'')+esc(w.text)+'</span><button class="btn sm" data-act="ocgo" data-d="'+w.date+'">Open day</button></li>').join('')+'</ul>':'<p class="muted" style="margin:0">Nothing to look at in this rota this month.</p>')+

async function savePartPE(){
  const id=PE.id,by={};
  PE.plan.filter(e=>e.dept).forEach(e=>{
    const x={dept:e.dept};['sub','vsub','fa','fb'].forEach(k=>{if(e[k])x[k]=e[k];});
    if(+e.from>1)x.from=+e.from;if(+e.to&&+e.to<28)x.to=+e.to;
    if(e.dept==='SSS'&&!x.vsub)delete x.vsub;
    const r=by[e.ym]=by[e.ym]||{ym:e.ym,parts:[]};r.parts.push(Object.assign(x,{_g:e.g,_note:e.note,_rep:e.repeat,_split:e.split}));
  });
  const plan=[];
  for(const ym of Object.keys(by).sort()){
    const r=by[ym],p0=r.parts[0],ent={ym};
    Object.keys(p0).filter(k=>k[0]!=='_').forEach(k=>ent[k]=p0[k]);
    if(p0._g)ent.g=p0._g;if(p0._note&&String(p0._note).trim())ent.note=String(p0._note).trim();if(p0._rep)ent.repeat=true;if(p0._split)ent.split=p0._split;
    const bad=r.parts.find(p=>p.from&&p.to&&p.from>p.to);if(bad){toast('In '+fmtYm(ym)+' a start day is after its end day.');return;}
    if(r.parts.length>1){ent.more=r.parts.slice(1).map(p=>{const q={};Object.keys(p).filter(k=>k[0]!=='_').forEach(k=>q[k]=p[k]);return q;});
      const rg=parts=>parts.map(p=>[p.from||1,p.to||31]),rr=rg(r.parts);let ov=false;rr.forEach((a,i)=>rr.forEach((b,j)=>{if(j>i&&a[0]<=b[1]&&b[0]<=a[1])ov=true;}));
      if(ov&&!(await askConfirm('Placements overlap','Two placements in '+fmtYm(ym)+' share some days. Save anyway?','Save anyway')))return;}
    plan.push(ent);
  }
  await mut('interns',id,b=>{b.plan=plan;b.startYm=plan.length?plan[0].ym:'';return b;});
  logEv('Updated the months for '+S.interns[id].name);closeModal();toast('Saved.');
}

/* ---------- wards with an absent intern last and not counted ---------- */
function wardsAt(rota,date,rec,id){
  if(rota!=='SURGICAL')return'';
  const key=ocKey(rota,ymOf(date)),dk=dayKey(date),fl=(S.leaveFlags&&S.leaveFlags[key]&&S.leaveFlags[key][dk])||{};
  if(fl[id])return null;
  const pn=S.presentN&&S.presentN[key]&&S.presentN[key][dk];
  const known=rec.ids.filter(i=>!fl[i]);
  const count=pn!=null?pn:known.length,pos=known.indexOf(id);
  return wardsFor(rota,count,pos<0?rec.ids.indexOf(id):pos);
}

}
function lbRead(){
  const num=id=>{const v=($(id)||{}).value;return v===''||v==null?0:Number(v);};
  const assess=[...document.querySelectorAll('#lb-as .lbin')].map(x=>x.value).filter(v=>v!=='').map(Number);
  return{assess,pres:num('lb-pres'),proc:num('lb-proc'),punct:num('lb-punct')};
}
function lbTotalC(sc){const a=sc.assess,avg=a.length?a.reduce((x,y)=>x+y,0)/a.length:0;return Math.round((avg+sc.pres+sc.proc+sc.punct)*10)/10;}
function lbCalc(){const t=$('lb-tot');if(t)t.textContent=lbTotalC(lbRead());}
document.addEventListener('input',ev=>{if(ev.target.closest&&ev.target.closest('#lb-sc'))lbCalc();});
function lbOk(sc){
  if(sc.assess.some(v=>!(v>=0&&v<=50)))return'Each assessment score must be between 0 and 50.';
  if(!(sc.pres>=0&&sc.pres<=10))return'Presentation must be between 0 and 10.';
  if(!(sc.proc>=0&&sc.proc<=10))return'Procedure must be between 0 and 10.';
  if(!(sc.punct>=0&&sc.punct<=30))return'Punctuality and professionalism must be between 0 and 30.';
  return'';
}
async function lbOpenFile(id){
  try{
    const j=await call('lbGet',{id});
    const bytes=Uint8Array.from(atob(j.b64),c=>c.charCodeAt(0)),url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
    const w=window.open(url,'_blank');if(!w){const a=document.createElement('a');a.href=url;a.download=j.name||'logbook.pdf';a.click();}
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(err){toast(err.message);}
}
Object.assign(ACT,{
  'lb-open':el=>lbModal(el.dataset.i,el.dataset.b),
  'lb-view':el=>lbOpenFile(el.dataset.id),
  'close-modal':()=>closeModal(),
  'lb-add':()=>{const d=document.createElement('div');d.className='row lba';d.innerHTML='<input type="number" min="0" max="50" step="0.5" class="lbin" aria-label="Assessment form score out of 50"><span class="small muted">/ 50</span><button class="btn sm" data-act="lb-rm" type="button" aria-label="Remove this score">×</button>';$('lb-as').appendChild(d);d.querySelector('input').focus();},
  'lb-rm':el=>{const r=el.closest('.lba');if(document.querySelectorAll('#lb-as .lba').length>1)r.remove();else r.querySelector('input').value='';lbCalc();},
  'lb-upload':async el=>{
    const f=($('lb-file')||{}).files&&$('lb-file').files[0];
    if(!f){toast('Choose a PDF file first.');return;}
    if(!/\.pdf$/i.test(f.name)&&f.type!=='application/pdf'){toast('Only PDF files can be uploaded.');return;}
    if(f.size>5*1024*1024){toast('That file is larger than 5 MB.');return;}
    el.disabled=true;el.textContent='Uploading…';
    try{
      const b64=await fileToB64(f);
      await call('lbUpload',{block:el.dataset.b,internId:el.dataset.i,name:f.name,b64});
      await loadAll();closeModal();toast('Logbook uploaded.');
    }catch(err){toast(err.message);el.disabled=false;el.textContent='Upload';}
  },
  'lb-score':async el=>{
    const id=el.dataset.id,sc=lbRead(),bad=lbOk(sc);
    if(!sc.assess.length){toast('Enter at least one assessment form score.');return;}
    if(bad){toast(bad);return;}
    const lb=S.logbooks[id];logEv('Scored the '+(BLOCK_NAME[lb.block]||lb.block)+' logbook of '+((S.interns[lb.internId]||{}).name||'an intern'));
    closeModal();
    await mut('logbooks',id,b=>Object.assign({},b,{status:'scored',comment:'',scores:sc,total:lbTotalC(sc)}));
  },
  'lb-back':async el=>{
    const id=el.dataset.id,c=($('lb-cmt')||{}).value||'';
    if(!c.trim()){toast('Write a short comment for the intern.');return;}
    const lb=S.logbooks[id];logEv('Sent back the '+(BLOCK_NAME[lb.block]||lb.block)+' logbook of '+((S.interns[lb.internId]||{}).name||'an intern'));
    closeModal();
    await mut('logbooks',id,b=>Object.assign({},b,{status:'sent_back',comment:c.trim()}));
  }
});

/* ---------- Education ---------- */
const edAudiences=()=>[['all','All interns']].concat(GROUPS.map(g=>['g:'+g,'Group '+g.toUpperCase()]),BLOCKS.map(b=>['r:'+b,'Rotation: '+BLOCK_NAME[b]]));
const edAudLabel=a=>{const f=edAudiences().find(x=>x[0]===(a||'all'));return f?f[1]:'All interns';};
function edWhen(s){return fmtDateY(s.date)+(s.time?' at '+s.time:'');}
function edCard(s){
  const tr=isTr();
  const mat=(s.links||[]).length?'<ul class="list" style="margin:6px 0 0">'+s.links.map(l=>'<li><a href="'+esc(l.url)+'" target="_blank" rel="noopener noreferrer">'+esc(l.label||'Material')+'</a></li>').join('')+'</ul>':'<p class="muted small" style="margin:6px 0 0">Material not uploaded yet.</p>';
  return'<section class="panel" style="margin-bottom:12px"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><h2 style="margin:0">'+esc(s.title)+'</h2><p class="small" style="margin:4px 0 0">'+esc(edWhen(s))+(s.venue?' · '+esc(s.venue):'')+'</p>'+(s.presenter?'<p class="small" style="margin:2px 0 0">Presenter: '+esc(s.presenter)+'</p>':'')+'</div><span class="tag info">'+esc(edAudLabel(s.audience))+'</span></div>'+mat+
   (tr?'<div class="row" style="margin-top:10px"><button class="btn sm" data-act="ed-edit" data-id="'+s.id+'">Edit</button><button class="btn sm bad" data-act="ed-del" data-id="'+s.id+'">Delete</button></div>':'')+'</section>';
}
function viewEducation(){
  const tr=isTr(),today=todayStr();
  if(!UI.edTab)UI.edTab='up';
  const all=Object.values(S.sessions);
  const up=all.filter(s=>s.date>=today).sort((a,b)=>(a.date+(a.time||''))<(b.date+(b.time||''))?-1:1),past=all.filter(s=>s.date<today).sort((a,b)=>(a.date+(a.time||''))<(b.date+(b.time||''))?1:-1);
  const list=UI.edTab==='up'?up:past;
  return head('Education','Teaching sessions and their material.',tr?'<button class="btn pri" data-act="ed-new">New session</button>':'')+
   '<div class="row" style="margin-bottom:12px"><button class="btn sm '+(UI.edTab==='up'?'pri':'')+'" data-act="ed-tab" data-v="up">Upcoming ('+up.length+')</button><button class="btn sm '+(UI.edTab==='past'?'pri':'')+'" data-act="ed-tab" data-v="past">Past ('+past.length+')</button></div>'+
   (list.length?list.map(edCard).join(''):emptyBox(UI.edTab==='up'?'No upcoming sessions.':'No past sessions yet.'));
}
function edForm(s){
  s=s||{};const links=(s.links&&s.links.length?s.links:[{label:'',url:''}]);
  const lr=l=>'<div class="row edl"><input type="text" class="edll" placeholder="Label (for example Slides)" value="'+esc(l.label||'')+'" aria-label="Link label"><input type="url" class="edlu" placeholder="https://drive.google.com/…" value="'+esc(l.url||'')+'" aria-label="Google Drive link"><button class="btn sm" type="button" data-act="ed-lrm" aria-label="Remove this link">×</button></div>';
  return'<h2>'+(s.id?'Edit session':'New session')+'</h2><label for="ed-title">Title</label><input type="text" id="ed-title" value="'+esc(s.title||'')+'"><label for="ed-pres">Presenter</label><input type="text" id="ed-pres" value="'+esc(s.presenter||'')+'"><label for="ed-venue">Venue</label><input type="text" id="ed-venue" value="'+esc(s.venue||'')+'">'+
   '<div class="grid2"><div><label for="ed-date">Date</label><input type="date" id="ed-date" value="'+esc(s.date||'')+'"></div><div><label for="ed-time">Time</label><input type="time" id="ed-time" value="'+esc(s.time||'')+'"></div></div>'+
   '<label for="ed-aud">Who is it for</label><select id="ed-aud">'+edAudiences().map(a=>'<option value="'+a[0]+'"'+((s.audience||'all')===a[0]?' selected':'')+'>'+esc(a[1])+'</option>').join('')+'</select>'+
   '<label>Material (Google Drive links)</label><div id="ed-links">'+links.map(lr).join('')+'</div><button class="btn sm" type="button" data-act="ed-ladd">+ Add a link</button><p class="hint">Upload the file to Google Drive, share it so interns can open it, and paste the link here. The app stores only the link.</p>'+
   '<div class="foot"><button class="btn" data-act="close-modal">Cancel</button><button class="btn pri" data-act="ed-save" data-id="'+esc(s.id||'')+'">Save</button></div>';
}
Object.assign(ACT,{
  'ed-tab':el=>{UI.edTab=el.dataset.v;},
  'ed-new':()=>{if(isTr())openModal(edForm(),true);},
  'ed-edit':el=>{if(isTr())openModal(edForm(S.sessions[el.dataset.id]),true);},
  'ed-ladd':()=>{const d=document.createElement('div');d.className='row edl';d.innerHTML='<input type="text" class="edll" placeholder="Label (for example Slides)" aria-label="Link label"><input type="url" class="edlu" placeholder="https://drive.google.com/…" aria-label="Google Drive link"><button class="btn sm" type="button" data-act="ed-lrm" aria-label="Remove this link">×</button>';$('ed-links').appendChild(d);},
  'ed-lrm':el=>{const r=el.closest('.edl');if(document.querySelectorAll('#ed-links .edl').length>1)r.remove();else r.querySelectorAll('input').forEach(i=>i.value='');},
  'ed-save':async el=>{
    if(!isTr())return;
    const title=$('ed-title').value.trim(),date=$('ed-date').value;
    if(!title){toast('Enter a title.');return;}if(!date){toast('Choose the date.');return;}
    const links=[...document.querySelectorAll('#ed-links .edl')].map(r=>({label:r.querySelector('.edll').value.trim(),url:r.querySelector('.edlu').value.trim()})).filter(l=>l.url);
    if(links.some(l=>!/^https:\/\//i.test(l.url))){toast('Links must start with https://');return;}
    const id=el.dataset.id||uid('s'),data={title,presenter:$('ed-pres').value.trim(),venue:$('ed-venue').value.trim(),date,time:$('ed-time').value,audience:$('ed-aud').value,links};
    logEv((el.dataset.id?'Edited':'Added')+' the education session “'+title+'”');
    closeModal();await put('sessions',id,data);
  },
  'ed-del':async el=>{
    const s=S.sessions[el.dataset.id];if(!s)return;
    if(!(await askConfirm('Delete this session','Delete “'+esc(s.title)+'”? The material links are removed from the app. The files in Google Drive are not touched.','Delete',true)))return;
    closeModal();logEv('Deleted the education session “'+s.title+'”');await del('sessions',s.id);
  }
});

/* ---------- Intern home: notices and session reminders ---------- */
function internNoticesPanel(){
  const all=Object.values(S.inotices).sort((a,b)=>b.at-a.at),un=all.filter(n=>!n.seen),shown=UI.inh?all:un;
  const li=n=>'<li class="'+(n.seen?'':'unseen')+'"><span>'+esc(n.text)+' <span class="muted small">'+fmtTs(n.at)+'</span></span></li>';
  return'<section class="panel" style="margin-bottom:16px"><h2>Notices'+(un.length?' <span class="tag warn">'+un.length+' unread</span>':'')+'</h2><div class="row" style="margin-bottom:8px"><button class="btn sm '+(UI.inh?'':'pri')+'" data-act="inh" data-v="0">New</button><button class="btn sm '+(UI.inh?'pri':'')+'" data-act="inh" data-v="1">History</button>'+(un.length?'<button class="btn sm" data-act="inread">Mark all as read</button>':'')+'</div>'+
   (shown.length?'<ul class="list">'+shown.slice(0,UI.inh?40:15).map(li).join('')+'</ul>':'<p class="muted" style="margin:0">'+(UI.inh?'Nothing in the history yet.':'No new notices.')+'</p>')+'</section>';
}
function edReminders(){
  const it=S.interns[E().internId],t=todayStr(),tm=(()=>{const d=new Date(+t.slice(0,4),+t.slice(5,7)-1,+t.slice(8,10)+1);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());})();
  const soon=Object.values(S.sessions).filter(s=>s.date===t||s.date===tm).sort((a,b)=>(a.date+(a.time||''))<(b.date+(b.time||''))?-1:1);
  if(!soon.length)return'';
  return'<section class="panel" style="margin-bottom:16px"><h2>Education</h2><ul class="list">'+soon.map(s=>'<li><span><b>'+(s.date===t?'Today':'Tomorrow')+(s.time?' '+esc(s.time):'')+'</b> · '+esc(s.title)+(s.venue?' · '+esc(s.venue):'')+'</span></li>').join('')+'</ul><p class="small" style="margin:6px 0 0"><a href="#education">All sessions</a></p></section>';
}
function internHomeExtras(h){
  const box=internNoticesPanel()+edReminders(),i=h.indexOf('</header>');
  return i<0?box+h:h.slice(0,i+9)+box+h.slice(i+9);
}
Object.assign(ACT,{
  inh:el=>{UI.inh=el.dataset.v==='1';},
  inread:async()=>{const ids=Object.values(S.inotices).filter(n=>!n.seen).map(n=>n.id);await mutMany('inotices',ids,b=>Object.assign({},b,{seen:true}));}
});

/*V45-JS-END*/
init();
</script>
