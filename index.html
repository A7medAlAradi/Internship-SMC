}
function planRotaImport(entries,mode,defaultRota){
  const saved=S.oncall,sim=clone(S.oncall);S.oncall=sim;
  const issues=[],stat={ready:0,skipped:0,warned:0,already:0,fixed:0};const touched=new Set(),omd={},ovr={};
  const alias=(RD('al_all')||{}).map||{},fixes=RI.fix||{},any=RI.anyway||new Set();
  const doc=(rota,ym)=>{const key=ocKey(rota,ym);return sim[key]=sim[key]||{id:key,unit:rota,ym,days:{}};};
  const om=(rota,ym)=>{const key=ocKey(rota,ym);if(!omd[key]){const o=omOf(rota,ym);omd[key]={unit:rota,ym,pl:clone(o.pl),lt:clone(o.lt),_t:new Set()};}return omd[key];};
  try{
    const ents=entries.map(e=>Object.assign({},e,{rota:e.hint||defaultRota}));
    if(mode==='replace'){
      const seen=new Set();
      ents.forEach(e=>{if(!ONCALL_UNITS.includes(e.rota)||!canRota(e.rota))return;const k=e.rota+e.date;if(seen.has(k))return;seen.add(k);const d=doc(e.rota,ymOf(e.date)),dk=dayKey(e.date);if(d.days[dk])d.days[dk].ids=[];});
    }
    ents.forEach(e=>{
      const where='Row '+e.row+(e.sheet?' of “'+e.sheet+'”':''),label=fmtDate(e.date),dk=dayKey(e.date);
      const nm0=e.names.join(', ');
      if(e.rota==='EM'||e.rota==='EMERGENCY'){issues.push({lvl:'skip',where,date:label,name:nm0,msg:'Emergency is a shift schedule, not an on-call rota. Fill it in on the On-call page or the Rota Emergency tab.'});stat.skipped+=e.names.length||1;return;}
      if(!ONCALL_UNITS.includes(e.rota)){issues.push({lvl:'skip',where,date:label,name:nm0,msg:'The rota “'+(e.hintText||'')+'” is not recognised.'});stat.skipped+=e.names.length||1;return;}
      if(!canRota(e.rota)){issues.push({lvl:'skip',where,date:label,name:nm0,msg:'You can’t change the '+UNIT_NAME[e.rota]+' rota.'});stat.skipped+=e.names.length||1;return;}
      const d=doc(e.rota,ymOf(e.date)),day=d.days[dk]=d.days[dk]||{need:null,ids:[]},o=om(e.rota,ymOf(e.date));
      day.ids=day.ids||[];touched.add(d.id);
      if(mode==='replace'&&!o._t.has(dk)){delete o.pl[dk];delete o.lt[dk];}o._t.add(dk);
      if(e.need!=null)day.need=e.need;
      const pairs=(e.cols&&e.cols.length)?[].concat(...e.cols.map(c=>c.names.map(n=>({tok:n,h:c.h})))):e.names.map(n=>({tok:n,h:''}));
      const resolve=(tok,asLate)=>{
        const p=cleanTok(tok);if(!p.name)return null;
        const key=e.rota+'|'+normName(p.name);
        let f=Object.prototype.hasOwnProperty.call(fixes,key)?fixes[key]:alias[key];
        if(f==='')return{skip:true};
        if(f){stat.fixed++;return{id:f,late:p.late,p};}
        const m=matchInRota(p.name,e.rota,e.date);
        if(m.id)return{id:m.id,late:p.late,p,by:m.by};
        if(!asLate){issues.push({lvl:'skip',kind:'name',key,where,date:label,name:p.name,msg:m.reason,cands:m.cands,suggest:m.suggest});stat.skipped++;}
        return null;
      };
      pairs.forEach(pr=>{
        const r=resolve(pr.tok);if(!r||r.skip){if(r&&r.skip)stat.skipped++;return;}
        const id=r.id;if(!S.interns[id])return;
        const ck=assignCheck(e.rota,id,e.date),hard=ck.block.filter(x=>x!=='Already on this day.');
        if(!hard.length&&ck.block.includes('Already on this day.')){stat.already++;}
        else{
          const ak=dk+':'+id,allow=hard.every(m=>canAnywayMsg(e.rota,m));
          if(hard.length){
            if(any.has(ak)&&allow){
              issues.push({lvl:'warn',kind:'forced',where,date:label,name:S.interns[id].name,msg:'Imported anyway: '+hard[0]});stat.warned++;
              const ov=ovr[d.id]=ovr[d.id]||[];hard.forEach(m=>{const t=ak+(/^Not placed in the/.test(m)?':x':':any');if(!ov.includes(t))ov.push(t);});
            }else{issues.push({lvl:'skip',kind:'rule',ak,allow,where,date:label,name:S.interns[id].name,msg:hard[0]});stat.skipped++;return;}
          }
          day.ids.push(id);stat.ready++;
          if(!hard.length)ck.warn.forEach(w=>{issues.push({lvl:'warn',where,date:label,name:S.interns[id].name,msg:w});stat.warned++;});
        }
        const pk=pr.h?placeKeyFor(e.rota,pr.h):'';
        if(pk){(o.pl[dk]=o.pl[dk]||{})[id]=pk;}
        if(r.late&&lateOn(e.rota)){const a=o.lt[dk]=o.lt[dk]||[];if(!a.includes(id))a.push(id);}
      });
      (e.lateNames||[]).forEach(t=>{const r=resolve(t,true);if(r&&r.id&&lateOn(e.rota)){if(day.ids.includes(r.id)){const a=o.lt[dk]=o.lt[dk]||[];if(!a.includes(r.id))a.push(r.id);}else{issues.push({lvl:'warn',where,date:label,name:cleanTok(t).name,msg:'Named for late coverage but not on the rota that day.'});stat.warned++;}}});
      if(e.rota==='SURGICAL')day.need=null;
      else if(day.need==null||day.need<day.ids.length)day.need=Math.max(day.need==null?CFG.defaultNeed:day.need,day.ids.length);
    });
  }finally{S.oncall=saved;}
  const docs=[...touched].map(k=>sim[k]);
  Object.values(omd).forEach(x=>{delete x._t;});

}

      const t=rows[i].map(c=>String(c==null?'':c)).join(' ');

      if(m&&MON3[m[3].toLowerCase()]){out.ym=m[4]+'-'+pad(MON3[m[3].toLowerCase()]);out.half=+m[1]===1||+m[1]<=halfDay(out.ym)?1:2;}
    }
    let mode='gs',cur='',col={no:0,name:1,notes:2,tel:3,x:4};
    rows.forEach((r,i)=>{
      const cells=r.map(c=>String(c==null?'':c).trim()),txt=cells.join(' ').trim();if(!txt)return;
      if(/sub-?\s*specialt/i.test(txt)&&cells.filter(Boolean).length<=2){mode='sub';return;}
      const fm=txt.match(/^firm\s*([1-4]|i{1,3}|iv)$/i);if(cells.filter(Boolean).length<=2&&fm){cur=SA_ROM[fm[1].toUpperCase()]||fm[1];return;}
      if(cells.some(c=>/^name$/i.test(c))){cells.forEach((c,j)=>{const k=c.toLowerCase();if(k==='no.'||k==='no')col.no=j;else if(k==='name')col.name=j;else if(/^notes?$/.test(k))col.notes=j;else if(/^tel/.test(k))col.tel=j;else if(k==='firm'||k==='unit')col.x=j;});return;}
      const name=cells[col.name]||'';if(!name||/^general surgery$/i.test(name)||/^#\s/.test(name))return;
      if(!/\d/.test(cells[col.no]||'')&&!(cells[col.tel]||'').replace(/\D/g,''))return;
      const neuro=/#/.test(name),clean=name.replace(/#/g,'').replace(/\s+/g,' ').trim();
      let x=cells[col.x]||'';
      out.rows.push({row:i+1,name:clean,neuro,notes:cells[col.notes]||'',tel:cells[col.tel]||'',kind:mode,firm:mode==='gs'?String(SA_ROM[x.toUpperCase()]||x||cur).replace(/\D/g,''):'',unit:mode==='sub'?x:''});
    });
  });
  if(!out.ym)out.notes.push('Could not read the month from the title (expected “01-14 / Nov / 2026”). Using '+fmtYm(UI.sgYm||ymOf(todayStr()))+', first half.');
  return out;
}
function saMatch(r,ym,cands){
  const tk=phoneKey(r.tel);
  if(tk){const hit=Object.values(S.interns).filter(it=>phoneKey(it.phone)===tk);if(hit.length===1)return{id:hit[0].id,by:'tel'};}
  const k=normName(r.name),tks=k.split(' ');
  const cs=cands.map(it=>({id:it.id,key:normName(it.name),t:normName(it.name).split(' ')}));
  let hit=cs.filter(c=>c.key===k);if(hit.length===1)return{id:hit[0].id,by:'name'};
  hit=cs.filter(c=>tks.every(t=>tokMatch(t,c.t)));if(hit.length===1)return{id:hit[0].id,by:'name'};
  if(hit.length>1)return{id:null,reason:'More than one intern in the surgical allocation matches this name.',cands:hit.map(c=>c.id)};
  const fz=cs.map(c=>({c,d:lev(k,c.key)})).sort((a,b)=>a.d-b.d);
  if(fz.length&&fz[0].d<=2&&(fz.length===1||fz[1].d>fz[0].d))return{id:fz[0].c.id,by:'close'};
  const g=matchIntern(r.name,buildNameIndex());
  if(g.id)return{id:g.id,by:'outside',outside:true};
  return{id:null,reason:'No intern in the surgical allocation has this name.',cands:fz.slice(0,6).map(x=>x.c.id)};
}
function saPlan(){
  const ym=SA.ym,h=saHalves(ym)[SA.half-1],cands=Object.values(S.interns).filter(it=>{const e=entryAt(it,ym);return e&&entryParts(e).some(p=>p.dept==='GS'||p.dept==='SSS');});
  const issues=[],changes=[],seen=new Set(),fixes=SA.fix||{};
  SA.rows.forEach(r=>{
    const where='Row '+r.row,key='SA|'+normName(r.name);
    let id=null,m=null;
    if(Object.prototype.hasOwnProperty.call(fixes,key)){id=fixes[key];if(id==='')return issues.push({lvl:'skip',where,name:r.name,msg:'Skipped by you.'});}
    else{m=saMatch(r,ym,cands);id=m.id;}
    if(!id){issues.push({lvl:'skip',kind:'name',key,where,name:r.name,msg:m.reason,cands:m.cands});return;}
    const it=S.interns[id];
    if(!cands.includes(it)){issues.push({lvl:'skip',where,name:it.name,msg:'Not in the surgical allocation for '+fmtYm(ym)+', so it was not imported.'});return;}
    if(seen.has(id)){issues.push({lvl:'warn',where,name:it.name,msg:'Listed twice in the sheet; the first row is used.'});return;}
    seen.add(id);
    const before=saPlace(it,ym,h),e=entryAt(it,ym),p=before&&before.p;
    const ch={id,it,r,before:before?(before.k==='GS'?'Firm '+(before.firm||'?'):before.k==='ORT'?'Orthopedics':saUnitShort(before.unit)||'Subspecialty'):'—',after:'',set:null,leaves:[]};
    if(r.kind==='gs'){
      if(!p||p.dept!=='GS'||p!==e)issues.push({lvl:'skip',where,name:it.name,msg:'This intern is not in General surgery in '+fmtYm(ym)+'.'});
      else if(!+r.firm)issues.push({lvl:'skip',where,name:it.name,msg:'No firm given.'});
      else{ch.after='Firm '+r.firm;ch.set={gs:r.firm};}
    }else{
      const spec=/neuro/i.test(r.unit)||r.neuro?CFG.neuroSpec:saSpecName(r.unit);
      if(!p||p.dept!=='SSS'||p!==e||e.vsub)issues.push({lvl:'skip',where,name:it.name,msg:'This intern does not have the split surgical month in '+fmtYm(ym)+'.'});
      else if(!spec)issues.push({lvl:'skip',where,name:it.name,msg:'Unit “'+r.unit+'” is not one of the surgical subspecialties.'});
      else{ch.after=saUnitShort(spec);ch.set={spec,orthFirst:SA.half===2};}
    }
    if(!ch.set)return;
    if(m&&m.by==='close')issues.push({lvl:'warn',where,name:it.name,msg:'Matched “'+r.name+'” by close spelling.'});
    if(m&&m.by==='tel'&&!normName(r.name).split(' ').some(u=>normName(it.name).split(' ').includes(u)))issues.push({lvl:'warn',where,name:it.name,msg:'Matched by phone number; the sheet says “'+r.name+'”.'});
    /* notes */
    String(r.notes||'').replace(/\bL\s*(\d{1,2})(?:\s*[-–]\s*(\d{1,2}))?/g,(x,a,b)=>{
      const A=+a,B=+(b||a);if(A<1||B>dim(ym)||B<A){issues.push({lvl:'warn',where,name:it.name,msg:'Leave “'+x+'” is not a valid range.'});return x;}
      const f=ym+'-'+saD2(A),t=ym+'-'+saD2(B);
      const have=leaveReqs(it.id).some(q=>q.status==='approved'&&q.kind==='annual'&&q.from<=f&&q.to>=t);
      if(!have)ch.leaves.push({from:f,to:t});
      return x;});
    const un=String(r.notes||'').match(/until\s*(\d{1,2})/i);
    if(un)issues.push({lvl:'warn',where,name:it.name,msg:'Moves on day '+un[1]+': set the next placement in Rotations (the sheet note is not applied automatically).'});
    changes.push(ch);
  });
  const missing=cands.filter(it=>{const pl=saPlace(it,ym,h);return pl&&pl.k!=='ORT'&&!seen.has(it.id)&&!issues.some(i=>i.name===it.name);});
  return{ym,h,issues,changes,missing};
}
function saPaint(){

  if(p.missing.length)h+='<p class="hint">In the allocation but not on the sheet (unchanged): '+esc(p.missing.map(x=>x.name).join(', '))+'.</p>';
  box.innerHTML=h;if(go){go.disabled=!ch.length;go.textContent='Apply '+ch.length+' changes';}
}

async function wcSaveAll(opts){
  opts=opts||{};if(WC.saving)return false;
  if(typeof navigator!=='undefined'&&navigator.onLine===false){toast('You are offline. Your changes are kept here; save when you are back online.');return false;}
  if(Object.keys(PLDIRTY).length&&typeof plFlush==='function'){try{await plFlush();}catch(e){}}
  if(!wcCount())return true;
  WC.saving=true;
  try{
    if(!opts.force){
      let fresh;try{fresh=(await call('load')).data;}catch(e){toast(e.message||'Could not check for other changes.');return false;}
      const conf=[];
      Object.values(WC.docs).forEach(d=>{
        if(d.col==='notices')return;
        const sv=fresh[d.col]&&fresh[d.col][d.id]?fresh[d.col][d.id]:null;
        const was=d.base===null?null:JSON.parse(d.base);
        if(!wcSame(was,sv))conf.push(d);
      });
      if(conf.length){
        WC.saving=false;
        const ans=await wcConflicts(conf);if(!ans)return false;
        conf.forEach(d=>{if(ans[wcKey(d.col,d.id)]==='theirs')delete WC.docs[wcKey(d.col,d.id)];});
        wcPersist();WC.saving=true;
      }
    }
    const docs=Object.values(WC.docs).sort((a,b)=>(a.col==='notices')-(b.col==='notices')||a.t-b.t);
    const opOf=d=>d.op==='del'?{op:'del',col:d.col,id:d.id}:{op:'set',col:d.col,id:d.id,data:d.data};
    const fails=[];let ok=0;
    const done=d=>{delete WC.docs[wcKey(d.col,d.id)];ok++;};
    for(let i=0;i<docs.length;i+=25){
      const part=docs.slice(i,i+25),logs=LOGQ.splice(0).map(text=>({op:'log',text}));
      try{const j=await call('save',{ops:part.map(opOf).concat(logs)});VER=j.v;part.forEach(done);}
      catch(e){
        if(logs.length)LOGQ.unshift(...logs.map(l=>l.text));
        if(e.code==='network'){fails.push({d:part[0],msg:e.message,net:true});break;}
        for(const d of part){
          try{const j=await call('save',{ops:[opOf(d)]});VER=j.v;done(d);}catch(e2){fails.push({d,msg:e2.message||'Could not save.'});}
        }
      }
    }
    wcPersist();
    WC.saving=false;
    try{await loadAll();}catch(e){}
    if(fails.length){
      openModal('<h2>Some changes could not be saved</h2><p class="hint" style="margin-top:0">The rest were saved. These are still on this device.</p><table class="tbl"><tbody>'+fails.map(f=>'<tr><td>'+esc(wcLabel(f.d))+'</td><td class="small" style="color:var(--bad)">'+esc(f.msg)+'</td><td><button class="btn sm" data-act="wc-undo1" data-k="'+esc(wcKey(f.d.col,f.d.id))+'">Discard this</button></td></tr>').join('')+'</tbody></table><div class="foot"><button class="btn" data-act="close">Close</button></div>',true);
      return false;
    }
    if(!opts.silent)toast(plural(ok,'change')+' saved.');
    return true;
  }finally{WC.saving=false;}
}

    openModal('<h2>Someone else changed these</h2><p class="hint" style="margin-top:0">While you were working, these were changed by someone else. Choose whose version to keep for each.</p><table class="tbl"><tbody>'+list.map((d,i)=>'<tr><td>'+esc(wcLabel(d))+'</td><td><label class="inline"><input type="radio" name="wcc'+i+'" value="mine" checked> Keep mine</label> <label class="inline"><input type="radio" name="wcc'+i+'" value="theirs"> Take theirs</label></td></tr>').join('')+'</tbody></table><div class="foot"><button class="btn" data-act="wc-conf-cancel">Cancel</button><button class="btn pri" data-act="wc-conf-go">Continue saving</button></div>',true);

}

function alDerive(it,ym){

    const p=parts[0],u=electiveUnit(p.sub);
    if(u==='GS'){if(p.fa&&p.fb&&p.fa!==p.fb)return[{val:'F:'+p.fa,from:1,to:h,ele:1},{val:'F:'+p.fb,from:h+1,to:dm,ele:1}];return[{val:'F:'+(p.fa||p.fb||''),from:1,to:dm,ele:1}];}
    if(u==='SSS')return[{val:/ortho/i.test(p.vsub||p.sub||'')?'O':'S:'+(p.vsub||eleSpec(p.sub)),from:1,to:dm,ele:1}];
    return[{val:'X:ELE',from:1,to:dm,fixed:true}];

      return[{val:'F:'+(p.fa||p.fb||''),from:1,to:dm}];

      const sg=S.surgery[it.id]||{},sp=Math.max(1,Math.min(dm-1,e.split||h)),spec='S:'+(sg.spec||'');

    if(p.dept==='GS')out.push({val:'F:'+(p.fa||''),from,to});
    else if(p.dept==='SSS')out.push({val:/^ortho/i.test(p.vsub||'')?'O':'S:'+(p.vsub||(S.surgery[it.id]||{}).spec||''),from,to});

    const parts=L.map(mk),ne=Object.assign({ym},keep,parts[0]||{dept:'ELE',sub:old.sub});if(parts.length>1)ne.more=parts.slice(1);

function alCheck(list,ym){
  const dm=dim(ym),L=list.filter(x=>x.val).slice().sort((a,b)=>a.from-b.from),errs=[],warn=[];

  for(let i=1;i<L.length;i++)if(L[i].from<=L[i-1].to)errs.push('Two placements share some days.');
  if(!errs.length){let d=1;L.forEach(x=>{if(x.from>d)warn.push('Days '+d+'–'+(x.from-1)+' have no placement.');d=x.to+1;});if(d<=dm)warn.push('Days '+d+'–'+dm+' have no placement.');}

function dlCheck(id,f){
  const it=S.interns[id],errors=[],warns=[];let days=0;
  if(!f.from||!f.to)return{errors,warns,days,wait:true};
  if(f.to<f.from){errors.push('The last day is before the first day.');return{errors,warns,days};}
  days=dayCount(f.from,f.to);

/* ===================== 4.11-E: upload a rota table into the draft ===================== */
function puCell(c){return c==null?'':String(c).trim();}
function puParse(sheets,ym){
  const dm=dim(ym);let best=null;
  sheets.forEach(sh=>{
    const rows=sh.rows||[];
    rows.forEach((r,ri)=>{
      if(best&&best.cols.length>=dm-1)return;
      const vals=r.map(c=>{const t=puCell(c);return /^\d{1,2}(\.0+)?$/.test(t)?+t:null;});
      const c1=vals.indexOf(1);if(c1<0)return;
      const cols=[c1];let next=2;
      for(let c=c1+1;c<vals.length&&next<=31;c++)if(vals[c]===next){cols.push(c);next++;}
      if(cols.length>=27&&(!best||cols.length>best.cols.length))best={rows,ri,cols};
    });
  });
  if(!best)return null;
  const {rows,ri,cols}=best,first=cols[0];
  let leaveCol=-1;
  for(let r=Math.max(0,ri-2);r<=ri+1&&leaveCol<0;r++)(rows[r]||[]).forEach((c,ci)=>{if(ci<first&&/leave/i.test(puCell(c)))leaveCol=ci;});
  const data=[];
  for(let r=ri+1;r<rows.length;r++){
    const row=rows[r]||[];
    if(row.slice(0,first).some(c=>/cover|total/i.test(puCell(c))))break;
    data.push(row);
  }
  /* the name column is the one left of the days holding the most letters */
  const score={};data.forEach(row=>{for(let c=0;c<first;c++){if(c===leaveCol)continue;const t=puCell(row[c]);if(/[A-Za-z؀-ۿ]{3,}/.test(t)&&!/^(GS|SSS|PED|NS|ELECTIVE|O|SS)$/i.test(t))score[c]=(score[c]||0)+t.length;}});
  let nameCol=0,bs=-1;Object.keys(score).forEach(c=>{if(score[c]>bs){bs=score[c];nameCol=+c;}});
  const out=[];let odd=0;
  data.forEach(row=>{
    const name=puCell(row[nameCol]);if(!name)return;
    const days=[],oddDays=[];
    cols.forEach((c,i)=>{const t=puCell(row[c]);if(!t||t==='0')return;if(/^(1|x|✓|✔)$/i.test(t))days.push(i+1);else{days.push(i+1);oddDays.push(i+1);odd++;}});
    out.push({name,days,leave:leaveCol>=0?puCell(row[leaveCol]):'',odd:oddDays});
  });
  return{rows:out,ndays:cols.length,odd};
}
function puMatch(name,ym){
  let m=null;try{m=matchInRota(name,PL_UNIT,ym+'-15');}catch(e){}
  if(m&&m.id)return m.id;
  try{const g=matchIntern(name,buildNameIndex());if(g&&g.id)return g.id;}catch(e){}
  return null;
}

  puReport(ym,calls,matched);

function acHistory(unit,ym){

  const cnt={},py=(()=>{const [y,m]=ym.split('-').map(Number);return m===1?(y-1)+'-12':y+'-'+pad(m-1);})();
  const om=omOf(unit,py);
  Object.keys(om.pl||{}).forEach(k=>Object.keys(om.pl[k]).forEach(i=>{(cnt[i]=cnt[i]||{});cnt[i][om.pl[k][i]]=(cnt[i][om.pl[k][i]]||0)+1;}));
  return cnt;
}
/* days: {d01:[ids]} -> {pl:{d01:{id:placeKey}}, counts:{id:{place:n}}, left:[{k,ids}]} ; keeps what is already set in `keep` */
function acAssign(unit,ym,days,keep){
  const places=placesOf(unit),n=dim(ym),cnt=acHistory(unit,ym),pl={},prev={},left=[];
  const caps={};places.forEach(p=>{caps[p.k]=p.s;});
  const elig=(id,date)=>{const it=S.interns[id];return it&&rotaOf(placementAt(it,date,S.surgery[id]))===unit;};
  const bump=(id,p)=>{(cnt[id]=cnt[id]||{});cnt[id][p]=(cnt[id][p]||0)+1;};
  for(let d=1;d<=n;d++){
    const k=dkOf(d),date=ym+'-'+pad(d),ids=(days[k]||[]).filter(i=>elig(i,date)),row={},free=Object.assign({},caps);
    const set=(keep&&keep[k])||{};
    ids.forEach(i=>{const p=set[i];if(p&&free[p]>0){row[i]=p;free[p]--;bump(i,p);}});
    let todo=ids.filter(i=>!row[i]);
    /* every way of giving the rest a column; pick the one that evens the counts out */
    let best=null;
    const go=(ix,fr,cur,cost)=>{
      if(best&&cost>=best.cost)return;
      if(ix===todo.length){best={cost,as:Object.assign({},cur)};return;}
      const i=todo[ix];let any=false;
      Object.keys(fr).forEach(p=>{if(fr[p]<=0)return;any=true;fr[p]--;cur[i]=p;go(ix+1,fr,cur,cost+((cnt[i]||{})[p]||0)*10+(prev[i]===p?4:0));delete cur[i];fr[p]++;});
      if(!any){go(ix+1,fr,cur,cost+1000);}
    };
    if(todo.length&&todo.length<=7)go(0,Object.assign({},free),{},0);
    else todo.forEach(i=>{const c=Object.keys(free).filter(p=>free[p]>0).sort((a,b)=>((cnt[i]||{})[a]||0)-((cnt[i]||{})[b]||0));if(c.length){row[i]=c[0];free[c[0]]--;bump(i,c[0]);}});
    if(best){Object.keys(best.as).forEach(i=>{row[i]=best.as[i];bump(i,best.as[i]);});}
    Object.keys(prev).forEach(i=>delete prev[i]);Object.keys(row).forEach(i=>{prev[i]=row[i];});
    const rest=ids.filter(i=>!row[i]);if(rest.length)left.push({k,ids:rest});
    if(Object.keys(row).length)pl[k]=row;
  }
  const mine={};Object.keys(pl).forEach(k=>Object.keys(pl[k]).forEach(i=>{(mine[i]=mine[i]||{});mine[i][pl[k][i]]=(mine[i][pl[k][i]]||0)+1;}));
  return{pl,counts:mine,left};
}
function acTable(unit,res){
  const places=placesOf(unit),ids=Object.keys(res.counts).sort((a,b)=>nmOf(a).localeCompare(nmOf(b)));
  if(!ids.length)return'';

}

    text(t,x,y,fs,bold){cur.push('BT 0 g /'+(bold?'F2':'F1')+' '+f(fs)+' Tf '+f(x)+' '+f(H-y)+' Td ('+pdfEnc(t)+') Tj ET');},

      if(t!==''&&t!=null){const fs=o.fs||9,txt=pdfFit(t,o.bold,fs,w-6),tw=pdfW(txt,o.bold,fs),tx=o.align==='l'?x+3:x+(w-tw)/2,ty=y+h/2+fs*0.34;api.text(txt,tx,ty,fs,o.bold);}

    build(){

      add('<< /Type /Catalog /Pages 2 0 R >>');add('PLACEHOLDER');
      const f1=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'),f2=add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
      const kids=[];
      pages.forEach(p=>{const s=p.join('\n'),c=add('<< /Length '+s.length+' >>\nstream\n'+s+'\nendstream'),pg=add('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+f(W)+' '+f(H)+'] /Resources << /Font << /F1 '+f1+' 0 R /F2 '+f2+' 0 R >> >> /Contents '+c+' 0 R >>');kids.push(pg+' 0 R');});
      objs[1]='<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+kids.length+' >>';
      let out='%PDF-1.4\n',offs=[];objs.forEach((o,i)=>{offs.push(out.length);out+=(i+1)+' 0 obj\n'+o+'\nendobj\n';});
      const xr=out.length;out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n'+offs.map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF';
      const u=new Uint8Array(out.length);for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;return u;
    }
  };
  return api;
}
function pdfRotaData(unit,ym){
  const n=dim(ym),sur=unit==='SURGICAL',W=(CFG&&CFG.wards)||{};
  const WC=sur?Object.keys(W).map(Number).filter(c=>c>=2&&c<=8&&(W[String(c)]||[]).some(Boolean)).sort((x,y)=>x-y):[];
  let K=sur?4:1;if(WC.length)K=Math.max(K,Math.max(...WC));
  for(let d=1;d<=n;d++)K=Math.max(K,dayRec(unit,ym+'-'+pad(d)).ids.length);
  const ALL=Object.keys(S.interns),sn=id=>plShort(id,ALL)||'?';
  const wards=WC.map(c=>{const cells=[];let p=0;while(p<c){const t=wardsFor(unit,c,p);let span=1;while(p+span<c&&wardsFor(unit,c,p+span)===t)span++;cells.push({t:String(t).replace(/,\s*/g,' - ')||'-',span});p+=span;}if(K>c)cells.push({t:'-',span:K-c});return{label:'Wards ('+c+' interns)',cells};});
  const days=[];for(let d=1;d<=n;d++){const date=ym+'-'+pad(d),rec=dayRec(unit,date),hol=holidayOf(date);days.push({n:d,wd:DAYSFULL[dow(date)],wk:isWkDay(date),hol:hol?(hol.label||'Holiday'):'',names:Array.from({length:K},(_,p)=>rec.ids[p]?sn(rec.ids[p]):'')});}
  const notes=sur?['All interns on-call must be in the hospital from 7am until 10pm.','Sick-leaves during on calls are only accepted from the emergency department in SMC.','All interns are expected to cover emergency and must attend once called for help.']:[];
  return{title:ocName(unit)+' Interns’ Rota - '+MONTHS_LONG[+ym.slice(5,7)-1]+' '+ym.slice(0,4),K,wards,days,notes};
}
function pdfDrawRota(pdf,D){
  const m=8*PDF_MM,x0=m,y0=m,w=pdf.W-2*m,h=pdf.H-2*m,rows=1+D.wards.length+D.days.length+D.notes.length,rh=Math.floor((h-1)/rows*100)/100;
  const wNo=9*PDF_MM,wDay=27*PDF_MM,cw=(w-wNo-wDay)/D.K,G='#c9c9c9',L='#e4e4e4',WK='#d9d9d9';
  let fs=Math.min(rh*0.56,11);
  const fit=(t,b,mw)=>{const k=pdfW(t,b,fs);if(k>mw-6)fs=Math.max(5,fs*(mw-6)/k);};
  D.days.forEach(d=>d.names.forEach(t=>fit(t,false,cw)));D.wards.forEach(r=>r.cells.forEach(c=>fit(c.t,true,cw*c.span)));D.notes.forEach(t=>fit('- '+t,true,w-wNo));
  pdf.page();let y=y0;
  pdf.cell(x0,y,w,rh,D.title,{fill:G,bold:true,fs:fs+1});y+=rh;
  D.wards.forEach(r=>{pdf.cell(x0,y,wNo+wDay,rh,r.label,{fill:G,bold:true,fs});let x=x0+wNo+wDay;r.cells.forEach(c=>{pdf.cell(x,y,cw*c.span,rh,c.t,{fill:G,bold:true,fs});x+=cw*c.span;});y+=rh;});
  const yd=y;
  D.days.forEach(d=>{
    pdf.cell(x0,y,wNo,rh,String(d.n),{fill:L,bold:true,fs});
    pdf.cell(x0+wNo,y,wDay,rh,d.wd,{fill:d.wk?WK:null,bold:true,fs});
    if(d.hol&&rh>=fs*2.3)pdf.text(pdfFit(d.hol,false,fs*0.55,wDay-4),x0+wNo+3,y+rh-2.2,fs*0.55,false);
    d.names.forEach((t,i)=>pdf.cell(x0+wNo+wDay+i*cw,y,cw,rh,t,{fill:d.wk?WK:null,fs}));
    y+=rh;});
  pdf.line(x0+wNo+wDay,yd,x0+wNo+wDay,y,1.6);pdf.line(x0,y,x0+w,y,1.6);
  D.notes.forEach(t=>{pdf.cell(x0,y,wNo,rh,'#',{fill:G,bold:true,fs});pdf.cell(x0+wNo,y,w-wNo,rh,'- '+t,{fill:G,bold:true,fs});y+=rh;});
  pdf.rect(x0,y0,w,y-y0,null,'#000000',1.6);
}
function pdfDrawAlloc(pdf,ym,hf){
  const r=pdfRows(ym,hf),m=8*PDF_MM,w=pdf.W-2*m,x0=m,y0=m,G='#c9c9c9',L='#e4e4e4';
  const CW=[10,84,46,30,24].map(v=>v*PDF_MM);let rows=3;
  const flat=[];
  [1,2,3,4].forEach(f=>{flat.push({k:'fh',t:'Firm '+f});(r.gs[f]||[]).forEach(x=>flat.push({k:'r',x,last:f}));});
  flat.push({k:'band',t:'Sub-specialties'},{k:'hdr',last:'Unit'});r.sub.forEach(x=>flat.push({k:'r',x,last:x.unit}));flat.push({k:'foot'});
  rows+=flat.length;
  const rh=Math.min(7*PDF_MM,Math.floor((pdf.H-2*m-1)/rows*100)/100);let fs=Math.min(rh*0.52,10);
  const all=[];[1,2,3,4].forEach(f=>(r.gs[f]||[]).forEach(x=>all.push(x)));r.sub.forEach(x=>all.push(x));
  all.forEach(x=>{const k=pdfW(x.it.name+(x.neuro?' #':''),false,fs);if(k>CW[1]-6)fs=Math.max(5,fs*(CW[1]-6)/k);});
  pdf.page();let y=y0;const hdr=(last)=>{let x=x0;['No.','Name','Notes','Tel',last].forEach((t,i)=>{pdf.cell(x,y,CW[i],rh,t,{fill:G,bold:true,fs});x+=CW[i];});y+=rh;};
  pdf.cell(x0,y,w,rh,saTitle(ym,hf),{fill:G,bold:true,fs:fs+1});y+=rh;
  pdf.cell(x0,y,w,rh,'General Surgery',{fill:G,bold:true,fs});y+=rh;hdr('Firm');
  let n=0,si=0;
  flat.forEach(e=>{
    if(e.k==='fh'){pdf.cell(x0,y,w,rh,e.t,{fill:L,bold:true,fs,align:'l'});y+=rh;}
    else if(e.k==='band'){pdf.cell(x0,y,w,rh,e.t,{fill:G,bold:true,fs});y+=rh;}
    else if(e.k==='hdr'){hdr(e.last);}
    else if(e.k==='foot'){pdf.cell(x0,y,w,rh,'#  Neurosurgery: not counted for surgical on-call.',{fill:G,bold:true,fs:fs-1,align:'l'});y+=rh;}
    else{const x=e.x;const isF=typeof e.last==='number';const no=isF?(++n):(++si);let xx=x0;
      [String(no),x.it.name+(x.neuro?' #':''),x.note,x.it.phone||'',String(e.last)].forEach((t,i)=>{pdf.cell(xx,y,CW[i],rh,t,{fs,align:(i===1||i===2)?'l':'c'});xx+=CW[i];});y+=rh;}
  });
  pdf.rect(x0,y0,w,y-y0,null,'#000000',1.6);
}
function pdfSave(bytes,name){
  const b=new Blob([bytes],{type:'application/pdf'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href);},1500);
}
function pdfExport(){
  const unit=UI.ocUnit,ym=UI.ocYm||ymOf(todayStr()),pdf=pdfNew();
  pdfDrawRota(pdf,pdfRotaData(unit,ym));
  if(unit==='SURGICAL')saHalves(ym).forEach(hf=>pdfDrawAlloc(pdf,ym,hf));
  pdfSave(pdf.build(),ocName(unit).replace(/\s+/g,'_')+'_rota_'+ym+'.pdf');
  toast('PDF saved to your downloads.');
}
ACT['oc-pdf']=()=>pdfExport();
