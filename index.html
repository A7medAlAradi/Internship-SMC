<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Internship board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EDF0F2;--surface:#FFFFFF;--surface2:#F6F8F9;--ink:#14212A;--ink2:#47565F;--ink3:#6E7D88;
  --line:#D5DCE1;--line2:#E6EBEE;--accent:#2B3A9B;--accent-ink:#FFFFFF;--accent-soft:#E3E7FA;
  --warn:#8F4300;--warn-bg:#FFF0D9;--bad:#B0231A;--bad-bg:#FDE6E3;--ok:#0A6A44;--ok-bg:#DAF3E6;
  --cbs:72%;--cbl:90%;--cfs:60%;--cfl:23%;--hatch:#E2E7EA;
  --fh:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --fb:'IBM Plex Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E161B;--surface:#162128;--surface2:#1B2830;--ink:#E5ECF0;--ink2:#A9B7C0;--ink3:#84939D;
    --line:#2B3841;--line2:#223039;--accent:#93A5FF;--accent-ink:#0E161B;--accent-soft:#232D58;
    --warn:#FFB866;--warn-bg:#3A2A12;--bad:#FF9E92;--bad-bg:#3E1C18;--ok:#72D8A8;--ok-bg:#12332A;
    --cbs:38%;--cbl:23%;--cfs:75%;--cfl:86%;--hatch:#26343D;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E161B;--surface:#162128;--surface2:#1B2830;--ink:#E5ECF0;--ink2:#A9B7C0;--ink3:#84939D;
  --line:#2B3841;--line2:#223039;--accent:#93A5FF;--accent-ink:#0E161B;--accent-soft:#232D58;
  --warn:#FFB866;--warn-bg:#3A2A12;--bad:#FF9E92;--bad-bg:#3E1C18;--ok:#72D8A8;--ok-bg:#12332A;
  --cbs:38%;--cbl:23%;--cfs:75%;--cfl:86%;--hatch:#26343D;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 var(--fb);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:10}
h1,h2,h3{font-family:var(--fh);font-weight:650;letter-spacing:-.01em;margin:0;line-height:1.2}
h1{font-size:1.7rem}h2{font-size:1.2rem}h3{font-size:1rem}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100dvh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100dvh - env(safe-area-inset-top,0px));overflow:auto}
.brand{font-family:var(--fh);font-weight:750;font-size:1.25rem;letter-spacing:-.02em;line-height:1.05;padding:2px 6px}
.brand small{display:block;font-family:var(--fb);font-weight:400;font-size:.78rem;color:var(--ink3);letter-spacing:0;margin-top:4px}
.me{padding:10px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--surface2);font-size:.88rem}
.me b{display:block;font-weight:600}.me span{color:var(--ink2)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:6px;color:var(--ink2);font-weight:500;border-left:3px solid transparent}
.nav a:hover{background:var(--surface2);text-decoration:none;color:var(--ink)}
.nav a.on{color:var(--ink);background:var(--accent-soft);border-left-color:var(--accent)}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:20px;font-size:.74rem;padding:0 7px;min-width:20px;text-align:center;line-height:20px;font-weight:600}
.preview{margin-top:auto;font-size:.82rem;color:var(--ink2)}
.preview select{width:100%;margin-top:4px}
.main{padding:26px 30px 60px;min-width:0}
.phead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
.phead p{margin:4px 0 0;color:var(--ink2)}
.pact{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 13px;border:1px solid var(--line);background:var(--surface);border-radius:7px;cursor:pointer;font-weight:500;min-height:36px;color:var(--ink)}
.btn:hover{background:var(--surface2);text-decoration:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 9px;min-height:28px;font-size:.86rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
input[type=text],input[type=search],input[type=tel],input[type=email],input[type=number],input[type=date],input[type=month],select,textarea{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--surface);min-height:36px}
textarea{min-height:76px;resize:vertical}
select{width:auto;max-width:100%}
label{display:block;font-weight:500;font-size:.9rem;margin:12px 0 4px}
label.inline{display:inline-flex;align-items:center;gap:6px;margin:0 12px 0 0;font-weight:400}
label.inline input{width:auto}
.hint{color:var(--ink2);font-size:.86rem;margin:4px 0 0}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.bar input[type=search]{width:240px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 13px;cursor:pointer;font-weight:500;color:var(--ink2);min-height:34px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:16px 18px}
.panel+.panel{margin-top:16px}
.panel>h2,.panel>h3{margin-bottom:10px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.cols .panel+.panel{margin-top:0}
.kpis{display:flex;flex-wrap:wrap;gap:28px;margin-bottom:18px}
.kpi b{display:block;font-family:var(--fh);font-size:2rem;font-weight:700;line-height:1}
.kpi span{color:var(--ink2);font-size:.88rem}
.note{padding:9px 12px;border-radius:7px;font-size:.9rem;margin:8px 0;border:1px solid transparent}
.note.warn{background:var(--warn-bg);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.note.bad{background:var(--bad-bg);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.note.ok{background:var(--ok-bg);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.note.info{background:var(--accent-soft);color:var(--ink)}
.chip{display:inline-block;padding:1px 8px;border-radius:5px;font-size:.8rem;font-weight:600;line-height:1.55;white-space:nowrap;background:hsl(var(--uh,210) var(--cbs) var(--cbl));color:hsl(var(--uh,210) var(--cfs) var(--cfl))}
.chip.frozen{background:repeating-linear-gradient(135deg,var(--hatch) 0 5px,transparent 5px 10px);color:var(--ink2);border:1px dashed var(--ink3)}
.chip.rep{outline:1.5px dotted var(--ink2);outline-offset:1px}
.tag{display:inline-block;padding:0 8px;border-radius:20px;font-size:.78rem;font-weight:600;line-height:1.6}
.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--bad)}.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.mute{background:var(--line2);color:var(--ink2)}.tag.info{background:var(--accent-soft);color:var(--ink)}
.scroll{overflow:auto;max-width:100%;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
table{border-collapse:collapse;width:100%}
.tbl th,.tbl td{padding:8px 12px;border-bottom:1px solid var(--line2);text-align:left;vertical-align:middle}
.tbl th{font-weight:600;color:var(--ink2);font-size:.86rem;background:var(--surface2);position:sticky;top:0;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:var(--surface2)}
.rota{width:auto;min-width:100%}
.rota th,.rota td{padding:4px 5px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);text-align:center;white-space:nowrap}
.rota thead th{background:var(--surface2);font-size:.8rem;font-weight:600;color:var(--ink2);position:sticky;top:0;z-index:2;padding:7px 6px}
.rota th.cur{color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.rota td.stick,.rota th.stick{position:sticky;left:0;z-index:3;text-align:left;background:var(--surface);min-width:190px;max-width:230px;padding:5px 10px}
.rota thead th.stick{background:var(--surface2);z-index:4}
.rota td.stick{font-weight:500}
.rota td.stick small{display:block;color:var(--ink3);font-weight:400;font-size:.76rem}
.rota .chip{min-width:44px;text-align:center}
.cap td.low{background:var(--accent-soft);color:var(--ink);font-weight:600}
.cap td.high{background:var(--warn-bg);color:var(--warn);font-weight:600}
.cap td{font-variant-numeric:tabular-nums}
.meter{height:8px;background:var(--line2);border-radius:5px;overflow:hidden;margin:6px 0}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.over i{background:var(--warn)}
.list{list-style:none;margin:0;padding:0}
.list li{padding:9px 0;border-bottom:1px solid var(--line2);display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:space-between;align-items:center}
.list li:last-child{border-bottom:0}
.muted{color:var(--ink2)}.small{font-size:.86rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}
.empty{padding:26px;text-align:center;color:var(--ink2);border:1px dashed var(--line);border-radius:9px;background:var(--surface)}
.req{border:1px solid var(--line);border-radius:9px;padding:14px 16px;background:var(--surface);margin-bottom:12px}
.req header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:4px}
.req .steps{margin:8px 0 0;padding-left:0;list-style:none;font-size:.86rem;color:var(--ink2)}
.req .steps li{padding:2px 0}
.tl{display:flex;gap:6px;overflow:auto;padding-bottom:6px}
.tl div{flex:0 0 auto;min-width:74px;text-align:center;font-size:.78rem;color:var(--ink2);padding:6px 4px;border:1px solid var(--line2);border-radius:7px;background:var(--surface2)}
.tl div.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tl .chip{margin-top:4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.cal .dh{background:var(--surface2);text-align:center;font-size:.8rem;font-weight:600;color:var(--ink2);padding:6px 0;border-bottom:1px solid var(--line)}
.cal .dh.wk{color:var(--warn)}
.day{border:0;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);background:var(--surface);min-height:96px;padding:5px 6px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;overflow:hidden;position:relative}
.day:nth-child(7n){border-right:0}
.day:hover{background:var(--surface2)}
.day.blank{background:var(--surface2);cursor:default}
.day.wk{background:color-mix(in srgb,var(--warn-bg) 55%,var(--surface))}
.day.sel{outline:2px solid var(--accent);outline-offset:-2px}
.day .dn{font-weight:600;font-size:.88rem}
.day .hol{font-size:.7rem;color:var(--warn);line-height:1.15}
.day .cov{position:absolute;top:5px;right:6px;font-size:.76rem;font-weight:600;color:var(--ink2)}
.day .cov.short{color:var(--bad)}.day .cov.full{color:var(--ok)}
.day .who{display:flex;flex-direction:column;gap:1px;font-size:.74rem;font-style:normal;line-height:1.25}
.day .who i{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .who i.mine{font-weight:700;color:var(--accent)}
.checks td,.checks th{text-align:center}
.checks td:first-child,.checks th:first-child{text-align:left}
.checks input{width:18px;height:18px}
.modalback{position:fixed;inset:0;background:rgba(10,18,24,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 14px max(24px,env(safe-area-inset-bottom,0px));overflow:auto}
.modal{background:var(--surface);border-radius:11px;border:1px solid var(--line);width:100%;max-width:600px;padding:20px 22px;box-shadow:0 14px 50px rgba(0,0,0,.3)}
.modal.wide{max-width:860px}
.modal h2{margin-bottom:4px}
.modal .foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:90;font-size:.92rem;max-width:90vw}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.loading{padding:80px 20px;text-align:center;color:var(--ink2)}
.claim{max-width:460px;margin:12vh auto;padding:0 18px}
.pill{display:inline-flex;align-items:center;gap:6px}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px}
  .nav{flex-direction:row;overflow:auto;gap:4px}
  .nav a{white-space:nowrap;border-left:0;border-bottom:3px solid transparent}
  .nav a.on{border-bottom-color:var(--accent)}
  .preview{margin-top:0}
  .main{padding:18px 14px 60px}
  .grid2{grid-template-columns:1fr}
  .day{min-height:70px;padding:3px}
  .day .who{display:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="root"><div class="loading">Loading the board…</div></div>
<div id="modal"></div>
<div id="toast"></div>
<script src="config.js"></script>
<script>
/* ============ Constants ============ */
const BLOCKS=['MED','MSS','GS','SSS','PED','OBG','ELE','EM'];
const BLOCK_NAME={MED:'Medicine',MSS:'Medical subspecialty',GS:'General surgery',SSS:'Surgical subspecialty and orthopedics',PED:'Pediatrics',OBG:'Obstetrics and gynecology',ELE:'Elective',EM:'Emergency',FROZEN:'Frozen'};
const BLOCK_SHORT={MED:'MED',MSS:'MSS',GS:'GS',SSS:'SSS',PED:'PED',OBG:'OBG',ELE:'ELE',EM:'EM',FROZEN:'Frozen'};
const UNITS=['MED','MSS','GS','SSS','NEURO','ORT','PED','OBG','ELE','EM'];
const UNIT_NAME={MED:'Medicine',MSS:'Medical subspecialty',GS:'General surgery',SSS:'Surgical subspecialty',NEURO:'Neurosurgery',MEDICAL:'Medical',SURGICAL:'Surgical',ORT:'Orthopedics',PED:'Pediatrics',OBG:'Obstetrics and gynecology',ELE:'Elective',EM:'Emergency'};
const BLOCK_UNITS={MED:['MED'],MSS:['MSS'],GS:['GS'],SSS:['SSS','NEURO','ORT'],PED:['PED'],OBG:['OBG'],ELE:['ELE'],EM:['EM']};
const HUE={MED:212,MSS:262,GS:28,SSS:318,NEURO:290,MEDICAL:212,SURGICAL:28,ORT:100,PED:145,OBG:178,ELE:52,EM:4,FROZEN:210};
const ONCALL_UNITS=['MEDICAL','SURGICAL','NEURO','ORT','PED','OBG','EM'];
const ROTA_MEMBERS={MEDICAL:['MED','MSS'],SURGICAL:['GS','SSS'],NEURO:['NEURO'],ORT:['ORT'],PED:['PED'],OBG:['OBG'],EM:['EM']};
const ROTA_HELP={MEDICAL:'Interns on Medicine and Medical subspecialty (MSS)',SURGICAL:'Interns on General surgery and Surgical subspecialty (SSS)',NEURO:'Interns doing Neurosurgery',ORT:'Interns on Orthopedics',PED:'Interns on Pediatrics',OBG:'Interns on Obstetrics and gynecology',EM:'Interns on Emergency'};
const ROTA_TAB={MEDICAL:'Rota Medical',SURGICAL:'Rota Surgical',NEURO:'Rota Neurosurgery',ORT:'Rota Orthopedics',PED:'Rota Pediatrics',OBG:'Rota OBG',EM:'Rota Emergency'};
function rotaOf(unit){for(const r of ONCALL_UNITS){if(ROTA_MEMBERS[r].includes(unit))return r;}return null;}
/* groups of rotations that share coordinators */
const COVER_GROUPS=[{id:'MEDICAL',short:'Medical',name:'Medical (Medicine and Medical subspecialty)',members:['MED','MSS']},{id:'SURGICAL',short:'Surgical',name:'Surgical (General surgery and Surgical subspecialty)',members:['GS','SSS']},{id:'NEURO',name:'Neurosurgery',members:['NEURO']},{id:'ORT',name:'Orthopedics',members:['ORT']},{id:'PED',name:'Pediatrics',members:['PED']},{id:'OBG',name:'Obstetrics and gynecology',members:['OBG']},{id:'EM',name:'Emergency',members:['EM']}];
function expandUnits(tokens){const out=[];(tokens||[]).forEach(t=>{const g=COVER_GROUPS.find(x=>x.id===t);(g?g.members:[t]).forEach(u=>{if(u!=='ELE'&&UNITS.includes(u)&&!out.includes(u))out.push(u);});});return out;}
function contractUnits(units){const out=[],used=new Set();COVER_GROUPS.forEach(g=>{if(g.members.every(m=>(units||[]).includes(m))){out.push(g.id);g.members.forEach(m=>used.add(m));}});(units||[]).forEach(u=>{if(!used.has(u)&&!out.includes(u))out.push(u);});return out;}
function tokenName(t){const g=COVER_GROUPS.find(x=>x.id===t);return g?g.name:(UNIT_NAME[t]||t);}
function unitsLabel(units){return contractUnits(units).map(tokenName).join(', ');}
function tokenShort(t){const g=COVER_GROUPS.find(x=>x.id===t);return g?(g.short||g.name):(UNIT_NAME[t]||t);}
function coverChips(units){return contractUnits(units).map(t=>chip(t,tokenShort(t))).join(' ');}
const ITEMS=[['period','Rotation period finished'],['oncalls','On-calls done'],['logbook','Logbook done'],['eval','Evaluation submitted'],['procbook','Procedure book done']];
const GROUPS=['1a','1b','1c','2a','2b','2c'];
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DEFAULT_CFG={
  pattern:{MED:2,MSS:1,GS:2,SSS:1,PED:2,OBG:2,ELE:1,EM:1},
  min:{MED:0,MSS:0,GS:0,SSS:0,PED:0,OBG:0,ELE:0,EM:0},
  medSubs:['Cardiology','Gastroenterology','Nephrology','Neurology','Pulmonology','Endocrinology'],
  surgSpecs:['Neurosurgery','Pediatric surgery','Urology','Vascular surgery','Plastic surgery'],
  electives:['Anesthesia','Radiology','Dermatology','Psychiatry','ENT','Ophthalmology','Family medicine','Pathology'],
  neuroSpec:'Neurosurgery',annualDays:15,capPerMonthDays:7,shiftMonthMax:6,shiftHalfMax:3,wkMonthWarn:2,wkHalfWarn:1,weekendDays:[5,6],prefix:'973',defaultNeed:2
};

/* ============ Small helpers ============ */
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const strip=o=>{const c=clone(o);delete c.id;return c;};
const $=id=>document.getElementById(id);
function ymOf(d){return d.slice(0,7);}
function ymIdx(ym){const [y,m]=ym.split('-').map(Number);return y*12+m-1;}
function ymAdd(ym,n){const t=ymIdx(ym)+n;return Math.floor(t/12)+'-'+pad(t%12+1);}
function dim(ym){const [y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate();}
function dow(d){const [y,m,dd]=d.split('-').map(Number);return new Date(y,m-1,dd).getDay();}
function todayStr(){const t=new Date();return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate());}
function dayCount(a,b){const [y1,m1,d1]=a.split('-').map(Number),[y2,m2,d2]=b.split('-').map(Number);return Math.round((Date.UTC(y2,m2-1,d2)-Date.UTC(y1,m1-1,d1))/864e5)+1;}
function fmtYm(ym){const [y,m]=ym.split('-').map(Number);return MONTHS[m-1]+' '+y;}
function fmtYmShort(ym){const [y,m]=ym.split('-').map(Number);return MONTHS[m-1]+' '+String(y).slice(2);}
function fmtDate(d){const [y,m,dd]=d.split('-').map(Number);return DAYS[dow(d)]+' '+dd+' '+MONTHS[m-1];}
function fmtDateY(d){const [y,m,dd]=d.split('-').map(Number);return dd+' '+MONTHS[m-1]+' '+y;}
function fmtTs(ms){const t=new Date(ms);return t.getDate()+' '+MONTHS[t.getMonth()]+', '+pad(t.getHours())+':'+pad(t.getMinutes());}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function plural(n,w){return n+' '+w+(n===1?'':'s');}
function shortName(n){const p=String(n||'?').trim().split(/\s+/);return p.length>1?p[0]+' '+p[p.length-1][0]+'.':p[0];}
function phoneKey(raw){
  let d=String(raw||'').replace(/\D/g,'');
  if(d.startsWith('00'))d=d.slice(2);
  const pre=(CFG&&CFG.prefix)||'973';
  if(pre&&d.startsWith(pre)&&d.length>pre.length+5)d=d.slice(pre.length);
  return d.length>=6?d:'';
}
function telHref(p){return 'tel:'+String(p||'').replace(/[^\d+]/g,'');}
function chip(u,label,extra){return '<span class="chip '+(extra||'')+'" style="--uh:'+(HUE[u]!=null?HUE[u]:210)+'">'+esc(label!=null?label:(BLOCK_SHORT[u]||u))+'</span>';}
function downloadCsv(rows){return rows.map(r=>r.map(c=>{c=String(c==null?'':c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(',')).join('\r\n');}

const S={config:null,interns:{},people:{},requests:{},checklists:{},surgery:{},oncall:{},holidays:[],log:[]};
let CFG=mergeCfg(null);
function mergeCfg(c){
  c=c||{};const d=DEFAULT_CFG;
  return Object.assign({},d,c,{pattern:Object.assign({},d.pattern,c.pattern||{}),min:Object.assign({},d.min,c.min||{})});
}
/* ============ Plan logic ============ */
function makePlan(startYm,variant,cfg){
  cfg=cfg||CFG;const v=((variant%BLOCKS.length)+BLOCKS.length)%BLOCKS.length;
  const order=BLOCKS.slice(v).concat(BLOCKS.slice(0,v));
  const plan=[];let i=0;
  order.forEach(b=>{for(let k=0;k<(cfg.pattern[b]||0);k++)plan.push({ym:ymAdd(startYm,i++),dept:b});});
  return plan;
}
function validatePlan(plan,cfg){
  cfg=cfg||CFG;const errs=[];
  if(!plan||!plan.length)return{ok:false,errors:['The plan is empty.']};
  for(let i=1;i<plan.length;i++){if(ymIdx(plan[i].ym)!==ymIdx(plan[i-1].ym)+1){errs.push('Months must follow one another with no gap (check '+fmtYm(plan[i].ym)+').');break;}}
  const counts={};
  plan.forEach(e=>{if(e.dept==='FROZEN'||e.repeat)return;counts[e.dept]=(counts[e.dept]||0)+1;});
  BLOCKS.forEach(b=>{const need=cfg.pattern[b]||0,have=counts[b]||0;if(need!==have)errs.push(BLOCK_NAME[b]+': '+plural(have,'month')+' planned, '+need+' required.');});
  Object.keys(counts).forEach(k=>{if(!BLOCKS.includes(k))errs.push('Unknown rotation “'+k+'”.');});
  return{ok:errs.length===0,errors:errs};
}
function entryAt(it,ym){return ((it&&it.plan)||[]).find(e=>e.ym===ym)||null;}
function placementAt(it,date,surg){
  const e=entryAt(it,ymOf(date));if(!e||e.dept==='FROZEN')return null;
  if(e.dept!=='SSS')return e.dept;
  const sub=surg&&surg.spec&&CFG.neuroSpec&&String(surg.spec).trim().toLowerCase()===String(CFG.neuroSpec).trim().toLowerCase()?'NEURO':'SSS';
  const first=surg&&surg.orthFirst?'ORT':sub,second=surg&&surg.orthFirst?sub:'ORT';
  return +date.slice(8,10)<=15?first:second;
}
function planStart(it){return it.plan&&it.plan.length?it.plan[0].ym:it.startYm;}
function planEnd(it){return it.plan&&it.plan.length?it.plan[it.plan.length-1].ym:it.startYm;}
function internStatus(it,ym){
  ym=ym||ymOf(todayStr());
  if(ymIdx(ym)<ymIdx(planStart(it)))return{k:'future',text:'Starts '+fmtYm(planStart(it))};
  if(ymIdx(ym)>ymIdx(planEnd(it)))return{k:'done',text:'Completed'};
  const e=entryAt(it,ym);if(!e)return{k:'future',text:'—'};
  if(e.dept==='FROZEN')return{k:'frozen',text:'Frozen',block:'FROZEN'};
  return{k:'active',text:BLOCK_NAME[e.dept],block:e.dept,entry:e};
}
function blockSpan(it,ym){
  const plan=it.plan||[];const i=plan.findIndex(e=>e.ym===ym);if(i<0)return[];
  const d=plan[i].dept;let a=i,b=i;
  while(a>0&&plan[a-1].dept===d)a--;
  while(b<plan.length-1&&plan[b+1].dept===d)b++;
  return plan.slice(a,b+1).map(e=>e.ym);
}
function applyFreeze(plan,fromDate,months){
  const ym=ymOf(fromDate);const i=plan.findIndex(e=>e.ym===ym);
  if(i<0)throw new Error('The freeze date is outside the intern’s plan.');
  const out=plan.slice(0,i).map(e=>({...e}));const first=fromDate.slice(8,10)==='01';let shift=months;let from=i;
  if(first){for(let k=0;k<months;k++)out.push({ym:ymAdd(ym,k),dept:'FROZEN'});}
  else{
    const cur=plan[i];out.push({...cur});
    for(let k=0;k<months;k++)out.push({ym:ymAdd(ym,1+k),dept:'FROZEN'});
    const rep={...cur,ym:ymAdd(ym,1+months),repeat:true};out.push(rep);shift=months+1;from=i+1;
  }
  for(let j=from;j<plan.length;j++)out.push({...plan[j],ym:ymAdd(plan[j].ym,shift)});
  return out;
}
function coordsFor(unit){
  return Object.values(S.people).filter(p=>(p.units||[]).includes(unit)).sort((a,b)=>(a.role===b.role?0:a.role==='coordinator'?-1:1));
}

/* ============ Leave logic ============ */
function leaveReqs(internId){return Object.values(S.requests).filter(r=>r.type==='leave'&&r.internId===internId);}
function annualUsed(internId,exceptId){
  return leaveReqs(internId).filter(r=>r.kind==='annual'&&r.status==='approved'&&r.id!==exceptId).reduce((s,r)=>s+dayCount(r.from,r.to),0);
}
function kindUsed(internId,kind){return leaveReqs(internId).filter(r=>r.kind===kind&&r.status==='approved').reduce((s,r)=>s+dayCount(r.from,r.to),0);}
function rotationUsed(it,ym,exceptId){
  const span=blockSpan(it,ym);
  return leaveReqs(it.id).filter(r=>r.kind==='annual'&&r.status==='approved'&&r.id!==exceptId&&span.includes(ymOf(r.from))).reduce((s,r)=>s+dayCount(r.from,r.to),0);
}
function leaveWarnings(r){
  const w=[];if(r.kind!=='annual')return w;
  const it=S.interns[r.internId];if(!it)return w;
  const days=dayCount(r.from,r.to),used=annualUsed(r.internId,r.id);
  if(used+days>CFG.annualDays)w.push('Over the yearly balance: '+(used+days)+' of '+CFG.annualDays+' days (this request adds '+days+').');
  const span=blockSpan(it,ymOf(r.from));
  if(span.length){
    const cap=CFG.capPerMonthDays*span.length,ru=rotationUsed(it,ymOf(r.from),r.id);
    const e=entryAt(it,ymOf(r.from));
    if(ru+days>cap)w.push('Over the rotation limit: '+(ru+days)+' of '+cap+' days in '+BLOCK_NAME[e.dept]+' ('+plural(span.length,'month')+').');
  }
  return w;
}
function onLeave(internId,date){return leaveReqs(internId).some(r=>r.status==='approved'&&r.from<=date&&date<=r.to);}
const KIND_NAME={annual:'Annual leave',sick:'Sick leave',emergency:'Emergency leave'};

/* ============ On-call logic ============ */
const ocKey=(unit,ym)=>unit+'_'+ym;
const dayKey=d=>'d'+d.slice(8,10);
function dayRec(unit,date){const doc=S.oncall[ocKey(unit,ymOf(date))];const r=doc&&doc.days&&doc.days[dayKey(date)];return r?{need:r.need==null?null:r.need,ids:r.ids||[]}:{need:null,ids:[]};}
function holidayOf(date){return S.holidays.find(h=>h.d===date)||null;}
function isWkDay(date){return CFG.weekendDays.includes(dow(date))||!!holidayOf(date);}
function periodKey(it,date){const e=entryAt(it,ymOf(date));if(e&&e.dept==='SSS')return ymOf(date)+(+date.slice(8,10)<=15?'a':'b');return ymOf(date);}
function shiftsOf(internId){
  const out=[];
  Object.values(S.oncall).forEach(doc=>{Object.keys(doc.days||{}).forEach(k=>{const v=doc.days[k];if((v.ids||[]).includes(internId))out.push({unit:doc.unit,date:doc.ym+'-'+k.slice(1)});});});
  return out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
}
function periodCounts(internId,date,list){
  const it=S.interns[internId];const pk=periodKey(it,date);
  const sh=(list||shiftsOf(internId)).filter(s=>periodKey(it,s.date)===pk);
  return{pk,split:pk.length>7,total:sh.length,wk:sh.filter(s=>isWkDay(s.date)).length};
}
function assignCheck(unit,internId,date){
  const it=S.interns[internId];const res={block:[],warn:[]};
  if(rotaOf(placementAt(it,date,S.surgery[internId]))!==unit)res.block.push('Not placed in the '+UNIT_NAME[unit]+' rota on this date.');
  if(dayRec(unit,date).ids.includes(internId))res.block.push('Already on this day.');
  const pc=periodCounts(internId,date);
  const max=pc.split?CFG.shiftHalfMax:CFG.shiftMonthMax;
  if(pc.total+1>max)res.block.push('Limit reached: '+pc.total+' of '+max+' on-calls '+(pc.split?'in this half of the month.':'this month.'));
  const wkMax=pc.split?CFG.wkHalfWarn:CFG.wkMonthWarn;
  if(isWkDay(date)&&pc.wk+1>wkMax)res.warn.push('Over the weekend and holiday limit: '+(pc.wk+1)+' of '+wkMax+'.');
  if(onLeave(internId,date))res.warn.push('Has approved leave on this date.');
  return res;
}
function eligibleFor(unit,date){
  return Object.values(S.interns).filter(it=>rotaOf(placementAt(it,date,S.surgery[it.id]))===unit).sort((a,b)=>a.name.localeCompare(b.name));
}


/* ============ Parsing helpers (shared) ============ */
function parseYmText(v){
  v=String(v==null?'':v).trim();if(!v)return'';
  let m=v.match(/^(\d{4})[-\/](\d{1,2})/);if(m&&+m[2]>=1&&+m[2]<=12)return m[1]+'-'+pad(+m[2]);
  m=v.match(/^(\d{1,2})[\/-](\d{4})$/);if(m&&+m[1]>=1&&+m[1]<=12)return m[2]+'-'+pad(+m[1]);
  if(/^\d{5}$/.test(v)){const d=new Date(Math.round((+v-25569)*864e5));return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1);}
  const t=Date.parse('1 '+v);if(!isNaN(t)){const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1);}
  return'';
}
function parseDateText(v){
  v=String(v==null?'':v).trim();if(!v)return'';
  let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);
  return'';
}
function genCode(){
  const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let s='';
  for(let i=0;i<8;i++)s+=A[Math.floor(Math.random()*A.length)];
  return s;
}
function normCode(c){return String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}

/* ============ Talking to the Google script ============ */
async function call(action,body){
  let res;
  try{
    res=await fetch(API.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,token:API.token},body||{}))});
  }catch(e){const er=new Error('No connection. Check your internet and try again.');er.code='network';throw er;}
  let j;try{j=await res.json();}catch(e){const er=new Error('The service did not answer properly. Try again in a moment.');er.code='bad_response';throw er;}
  if(!j.ok){const er=new Error(j.message||'Something went wrong.');er.code=j.error;if(j.error==='unauthorized')signedOut();throw er;}
  return j;
}
function signedOut(){API.token=null;try{localStorage.removeItem('ib_token');}catch(e){}ME={role:'loading'};LOADED=false;stopPolling();scheduleRender();}
async function loadAll(){
  const j=await call('load');
  const d=j.data;
  S.interns=d.interns||{};S.people=d.people||{};S.requests=d.requests||{};S.checklists=d.checklists||{};S.surgery=d.surgery||{};S.oncall=d.oncall||{};
  S.config=d.config||null;CFG=mergeCfg(S.config);S.holidays=d.holidays||[];S.log=d.log||[];
  ME=Object.assign({},j.me);VER=j.v;LOADED=true;LOADERR='';
  if(PREVIEW){const ok=PREVIEW.role==='intern'?S.interns[PREVIEW.internId]:S.people[PREVIEW.personId];if(!ok)PREVIEW=null;}
  scheduleRender();
}
async function refresh(){try{await loadAll();}catch(e){if(e.code!=='unauthorized'){LOADERR=e.message;scheduleRender();}}}
let pollT=null,lastFull=0;
function startPolling(){
  stopPolling();lastFull=Date.now();
  pollT=setInterval(async()=>{
    if(document.hidden||SAVING||!API.token)return;
    try{const j=await call('ping');if(j.v!==VER||Date.now()-lastFull>180000){lastFull=Date.now();await loadAll();}}catch(e){}
  },30000);
}
function stopPolling(){if(pollT)clearInterval(pollT);pollT=null;}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&API.token&&LOADED&&!SAVING)call('ping').then(j=>{if(j.v!==VER)loadAll();}).catch(()=>{});});

/* ============ Saving ============ */
const WQ={};
function qwrite(path,fn){const p=(WQ[path]||Promise.resolve()).catch(()=>{}).then(fn);WQ[path]=p;return p;}
let LOGQ=[],logT=null;
function logEv(text){LOGQ.push(text);clearTimeout(logT);logT=setTimeout(flushLog,1500);}
async function flushLog(){
  if(!LOGQ.length||!API.token)return;
  const ops=LOGQ.splice(0).map(text=>({op:'log',text}));
  try{await call('save',{ops});}catch(e){}
}
async function send(ops){
  SAVING++;
  try{
    const logs=LOGQ.splice(0).map(text=>({op:'log',text}));
    const j=await call('save',{ops:ops.concat(logs)});VER=j.v;
  }catch(e){toast(e.message||'Could not save.');await refresh();throw e;}
  finally{SAVING--;}
}
async function mut(col,id,fn){
  return qwrite(col+'/'+id,async()=>{
    try{
      const base=S[col][id]?strip(S[col][id]):null;
      const next=fn(base);if(next===undefined||next===false)return;
      S[col][id]={...next,id};scheduleRender();
      await send([{op:'set',col,id,data:next}]);
    }catch(err){/* already reported by send() */}
  });
}
const put=(col,id,data)=>mut(col,id,()=>data);
async function mutMany(col,ids,fn){
  const ops=[];
  ids.forEach(id=>{const base=S[col][id]?strip(S[col][id]):null;const next=fn(base,id);if(next===undefined||next===false)return;S[col][id]={...next,id};ops.push({op:'set',col,id,data:next});});
  scheduleRender();
  for(let i=0;i<ops.length;i+=40){try{await send(ops.slice(i,i+40));}catch(e){return;}}
}
async function putMany(col,items){
  const ops=items.map(([id,data])=>{S[col][id]={...data,id};return{op:'set',col,id,data};});
  scheduleRender();
  for(let i=0;i<ops.length;i+=40){try{await send(ops.slice(i,i+40));}catch(e){return;}}
}
async function del(col,id){
  return qwrite(col+'/'+id,async()=>{try{delete S[col][id];scheduleRender();await send([{op:'del',col,id}]);}catch(e){}});
}
async function delMany(list){
  list.forEach(([c,i])=>{delete S[c][i];});scheduleRender();
  for(let i=0;i<list.length;i+=40){try{await send(list.slice(i,i+40).map(([col,id])=>({op:'del',col,id})));}catch(e){return;}}
}

/* ============ Certificates ============ */
function fileToB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob);});}
async function prepCert(file){
  if(file.type==='application/pdf'){if(file.size>4500000)throw new Error('That PDF is too large. Use one under 4 MB.');return{mime:file.type,b64:await fileToB64(file)};}
  if(!/^image\//.test(file.type))throw new Error('Use a photo (JPG or PNG) or a PDF.');
  const bmp=await new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(u);res(img);};img.onerror=()=>rej(new Error('That image could not be read.'));img.src=u;});
  const sc=Math.min(1,1600/Math.max(bmp.width,bmp.height)),cv=document.createElement('canvas');cv.width=Math.round(bmp.width*sc);cv.height=Math.round(bmp.height*sc);
  cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.82));
  return{mime:'image/jpeg',b64:await fileToB64(blob)};
}
async function uploadCert(file){const p=await prepCert(file);const j=await call('upload',p);return j.fileId;}
async function viewCert(requestId){
  try{
    const j=await call('file',{requestId});
    const bytes=Uint8Array.from(atob(j.b64),c=>c.charCodeAt(0)),url=URL.createObjectURL(new Blob([bytes],{type:j.mime}));
    const w=window.open(url,'_blank');if(!w){const a=document.createElement('a');a.href=url;a.download='certificate';a.click();}
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){toast(e.message);}
}

function canDecide(r){
  if(r.status==='approved'||r.status==='declined')return false;
  const e=E();
  if(e.role==='training')return true;
  if(e.role==='coordinator')return r.type==='leave'&&r.status==='pending_coord'&&myUnits().includes(r.unit);
  return false;
}
function myDecisions(){return Object.values(S.requests).filter(r=>{
  const e=E();
  if(e.role==='training')return r.status==='pending_training'||(r.type!=='leave'&&r.status==='pending');
  if(e.role==='coordinator')return canDecide(r);
  return false;});}
function computeIssues(scope){
  const out=[],today=todayStr(),ym0=ymOf(today);
  const inB=b=>!scope||BLOCK_UNITS[b].some(u=>scope.includes(u));
  const inU=u=>!scope||(ROTA_MEMBERS[u]||[u]).some(x=>scope.includes(x));
  if(!scope)Object.values(S.interns).forEach(it=>{const v=validatePlan(it.plan);if(!v.ok)out.push({lvl:'bad',text:it.name+'’s plan breaks the rotation pattern. '+v.errors[0],to:'intern-'+it.id});});
  for(let k=0;k<3;k++){
    const ym=ymAdd(ym0,k),counts={};
    Object.values(S.interns).forEach(it=>{const e=entryAt(it,ym);if(e&&e.dept!=='FROZEN')counts[e.dept]=(counts[e.dept]||0)+1;});
    BLOCKS.forEach(b=>{
      if(!inB(b))return;const mn=CFG.min[b]||0,n=counts[b]||0;
      if(mn>0&&n<mn)out.push({lvl:'warn',text:BLOCK_NAME[b]+' in '+fmtYm(ym)+': '+plural(n,'intern')+', fewer than the minimum of '+mn+'.',to:'rotations',tab:'capacity'});
    });
  }
  Object.values(S.oncall).forEach(doc=>{
    if(!inU(doc.unit)||ymIdx(doc.ym)<ymIdx(ym0))return;
    let short=0;
    Object.keys(doc.days||{}).forEach(k=>{const v=doc.days[k],d=doc.ym+'-'+k.slice(1);if(d>=today&&v.need!=null&&(v.ids||[]).length<v.need)short++;});
    if(short)out.push({lvl:'warn',text:UNIT_NAME[doc.unit]+' rota for '+fmtYm(doc.ym)+': '+plural(short,'day')+' short of the cover needed.',to:'oncall',unit:doc.unit,ym:doc.ym});
    Object.keys(doc.days||{}).forEach(k=>{
      const date=doc.ym+'-'+k.slice(1);if(date<today)return;
      (doc.days[k].ids||[]).forEach(id=>{const it=S.interns[id];if(it&&onLeave(id,date))out.push({lvl:'warn',text:it.name+' is on the '+UNIT_NAME[doc.unit]+' rota on '+fmtDate(date)+' but has approved leave.',to:'oncall',unit:doc.unit,ym:doc.ym});});
    });
  });
  Object.values(S.interns).forEach(it=>{
    const all=shiftsOf(it.id).filter(s=>ymIdx(ymOf(s.date))>=ymIdx(ym0));if(!all.length)return;
    const done={};
    all.forEach(s=>{
      if(!inU(s.unit))return;const pk=periodKey(it,s.date);if(done[pk])return;done[pk]=1;
      const wk=shiftsOf(it.id).filter(x=>periodKey(it,x.date)===pk&&isWkDay(x.date)).length,lim=pk.length>7?CFG.wkHalfWarn:CFG.wkMonthWarn;
      if(wk>lim)out.push({lvl:'warn',text:it.name+' has '+wk+' weekend and holiday on-calls in '+fmtYm(pk.slice(0,7))+(pk.length>7?(pk.endsWith('a')?' (first half)':' (second half)'):'')+'; the limit is '+lim+'.',to:'intern-'+it.id});
    });
  });
  Object.values(S.requests).forEach(r=>{
    if(r.type!=='leave'||r.status==='approved'||r.status==='declined')return;
    if(scope&&!scope.includes(r.unit))return;
    const w=leaveWarnings(r);if(w.length)out.push({lvl:'warn',text:((S.interns[r.internId]||{}).name||'An intern')+', '+KIND_NAME[r.kind].toLowerCase()+' from '+fmtDate(r.from)+': '+w[0],to:'requests'});
  });
  if(!scope)COVER_GROUPS.forEach(g=>{if(!g.members.some(m=>coordsFor(m).length))out.push({lvl:'warn',text:'No coordinator is set for '+(g.short||g.name)+'.',to:'coordinators'});});
  return out;
}

function parseRoute(){
  let r=(location.hash||'').replace(/^#/,'');const e=E();
  const dflt=e.role==='intern'?'myyear':'overview';
  if(!r)return dflt;
  const base=r.split('-')[0];
  const ok={
    training:['overview','rotations','oncall','requests','surgery','checklists','interns','coordinators','activity','setup','intern','person'],
    coordinator:['overview','rotations','oncall','requests','surgery','checklists','intern','person'],
    intern:['myyear','oncall','requests']
  }[e.role]||[];
  if(!ok.includes(base))return dflt;
  if(base==='surgery'&&!canSurg())return dflt;
  if(e.role==='intern'&&base==='myyear')return r;
  return r;
}

function filteredInterns(months){
  const q=UI.q.trim().toLowerCase();
  return Object.values(S.interns).filter(it=>{
    if(q&&!(it.name.toLowerCase().includes(q)||String(it.phone||'').includes(q)))return false;
    if(UI.fCohort&&planStart(it)!==UI.fCohort)return false;
    if(UI.fGroup&&it.group!==UI.fGroup)return false;

  }).sort((a,b)=>planStart(a)<planStart(b)?-1:planStart(a)>planStart(b)?1:a.name.localeCompare(b.name));
}

/* ----- Sheet upload ----- */
let UP=null;
function parseCSV(text){
  text=text.replace(/^\ufeff/,'');
  const first=text.split(/\r?\n/)[0]||'';const delim=(first.match(/\t/g)||[]).length>=1?'\t':((first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',');
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}
    else if(c==='"')q=true;
    else if(c===delim){row.push(cell);cell='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[];}
    else cell+=c;
  }
  row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row);
  return rows;
}
function parseStart(v){
  v=String(v==null?'':v).trim();if(!v)return'';
  let m=v.match(/^(\d{4})[-\/](\d{1,2})/);if(m&&+m[2]>=1&&+m[2]<=12)return m[1]+'-'+pad(+m[2]);
  m=v.match(/^(\d{1,2})[\/-](\d{4})$/);if(m&&+m[1]>=1&&+m[1]<=12)return m[2]+'-'+pad(+m[1]);
  if(/^\d{5}$/.test(v)){const d=new Date(Math.round((+v-25569)*864e5));return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1);}
  const t=Date.parse('1 '+v);if(!isNaN(t)){const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1);}
  return'';
}
function analyzeSheet(rows){
  if(!rows.length)return{errors:['The sheet is empty.'],items:[]};
  const hdr=rows[0].map(h=>String(h).trim().toLowerCase());
  const find=re=>hdr.findIndex(h=>re.test(h));
  let ci={name:find(/name/),phone:find(/phone|contact|mobile|number|tel/),email:find(/mail/),start:find(/start|month|begin|join/),group:find(/group/)};
  if(ci.name<0||ci.phone<0)return{errors:['The first row needs headings. Expected: Name, Contact number, Email, Start month.'],items:[]};
  const seen=new Set(),items=[];
  rows.slice(1).forEach((r,i)=>{
    const g=k=>ci[k]>=0?String(r[ci[k]]==null?'':r[ci[k]]).trim():'';
    const name=g('name'),phone=g('phone'),email=g('email'),start=parseStart(g('start')),grp=g('group').toLowerCase().replace(/^group\s*/,''),errs=[];
    if(!name)errs.push('Name is missing');
    const k=phoneKey(phone);
    if(!k)errs.push('Contact number is missing or too short');
    else if(seen.has(k))errs.push('Number repeated in this sheet');
    else if(phoneTaken(phone))errs.push('Number already in the system');
    if(!start)errs.push('Start month is missing or not understood');
    if(grp&&!GROUPS.includes(grp))errs.push('Group must be one of '+GROUPS.join(', '));
    if(k)seen.add(k);
    items.push({line:i+2,name,phone,email,start,group:GROUPS.includes(grp)?grp:'',errs});
  });
  return{errors:[],items};
}
function openUpload(){
  UP={items:[],errors:[],file:''};
  openModal('',true);paintUpload();

  const ok=UP.items.filter(x=>!x.errs.length).length,bad=UP.items.length-ok;

async function decide(id,action,extra){
  const r=S.requests[id];if(!r||!canDecide(r))return;
  const e=E();extra=extra||{};
  let note=extra.note||'';
  const step={role:stepRole(),by:actor(),action,at:Date.now(),note:note};
  let status;
  if(action==='declined')status='declined';
  else if(r.type==='leave'&&e.role==='coordinator')status='pending_training';
  else status='approved';
  if(e.role==='training'&&r.status==='pending_coord'&&action==='approved')step.note=(step.note?step.note+' ':'')+'(coordinator step skipped)';
  const name=(S.interns[r.internId]||{}).name||'an intern';
  await mut('requests',id,b=>{b.steps=(b.steps||[]).concat([step]);b.status=status;if(extra.months)b.months=extra.months;return b;});
  if(status==='approved'&&r.type==='elective'){
    await mut('interns',r.internId,b=>{b.plan.forEach(x=>{if(x.dept==='ELE')x.sub=r.elective;});return b;});
  }
  if(status==='approved'&&r.type==='freeze'){
    try{await mut('interns',r.internId,b=>{b.plan=applyFreeze(b.plan,r.from,extra.months||1);return b;});}catch(err){toast(err.message);}
  }
  logEv((action==='approved'?'Approved':'Declined')+' '+(r.type==='leave'?KIND_NAME[r.kind].toLowerCase():r.type)+' request for '+name);
  toast(action==='approved'?(status==='pending_training'?'Approved. Sent to the Training department.':'Approved.'):'Declined.');
}

function getLeaveForm(){
  const m=$('modal');const k=m.querySelector('input[name=lv-kind]:checked');
  return{kind:k?k.value:'annual',from:$('lv-from').value,to:$('lv-to').value,reason:$('lv-reason').value,file:$('lv-file')&&$('lv-file').files[0]||null};

function checkLeave(f,internId){
  const it=S.interns[internId],errors=[],warns=[];let days=0;
  if(!f.from||!f.to)return{errors,warns,days,wait:true};
  if(f.to<f.from)errors.push('The end date is before the start date.');
  else{
    days=dayCount(f.from,f.to);
    if(ymOf(f.from)!==ymOf(f.to))errors.push('A request has to stay inside one calendar month. Send a second request for the days in the next month.');
    const en=entryAt(it,ymOf(f.from));
    if(!en)errors.push('These dates are outside your training plan.');else if(en.dept==='FROZEN')errors.push('Your internship is frozen in this month.');
    const clash=leaveReqs(internId).find(r=>r.status!=='declined'&&r.from<=f.to&&f.from<=r.to);
    if(clash)errors.push('This overlaps another leave request ('+fmtDate(clash.from)+' to '+fmtDate(clash.to)+').');
  }
  if(f.kind==='emergency'&&!f.reason.trim())errors.push('Add a short reason for emergency leave.');
  if(f.kind==='sick'&&!f.file)errors.push('Attach the medical certificate (a photo or a PDF).');
  if(!errors.length)leaveWarnings({id:null,internId,kind:f.kind,from:f.from,to:f.to}).forEach(w=>warns.push(w));
  return{errors,warns,days};
}

async function inflateRaw(bytes){

}
async function unzip(buf){

    files[new TextDecoder().decode(u8.subarray(p+46,p+46+nl))]={method,csize,lho};p+=46+nl+el+cl;
  }
  return{files,async read(name){
    const f=files[name];if(!f)return null;
    const nl=dv.getUint16(f.lho+26,true),el=dv.getUint16(f.lho+28,true),start=f.lho+30+nl+el,data=u8.subarray(start,start+f.csize);
    return f.method===0?data:await inflateRaw(data);

}

function xlsxIsDateFormat(id,custom){

  const wb=parse(wbx),rels=parse(await txt('xl/_rels/workbook.xml.rels')),target={};

  const shared=[],ssx=await txt('xl/sharedStrings.xml');
  if(ssx)Array.from(parse(ssx).getElementsByTagName('si')).forEach(si=>{shared.push(Array.from(si.getElementsByTagName('t')).filter(t=>t.parentNode.nodeName!=='rPh').map(t=>t.textContent).join(''));});
  const custom={},xfs=[],stx=await txt('xl/styles.xml');
  if(stx){const st=parse(stx);Array.from(st.getElementsByTagName('numFmt')).forEach(n=>{custom[+n.getAttribute('numFmtId')]=n.getAttribute('formatCode');});
    const cx=st.getElementsByTagName('cellXfs')[0];if(cx)Array.from(cx.getElementsByTagName('xf')).forEach(x=>xfs.push(+x.getAttribute('numFmtId')||0));}

  for(const sh of Array.from(wb.getElementsByTagName('sheet'))){
    const rid=sh.getAttribute('r:id')||sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    let t=target[rid]||'';t=t.replace(/^\//,'');if(!t.startsWith('xl/'))t='xl/'+t;
    const sx=await txt(t);if(!sx)continue;

    Array.from(parse(sx).getElementsByTagName('c')).forEach(c=>{
      const ref=c.getAttribute('r');if(!ref)return;

      if(ty==='s')val=v?shared[+v.textContent]||'':'';
      else if(ty==='inlineStr')val=Array.from(c.getElementsByTagName('t')).map(x=>x.textContent).join('');
      else if(ty==='b')val=!!v&&v.textContent==='1';

      else if(ty==='e')val='';

      while(rows.length<=ri)rows.push([]);const row=rows[ri];while(row.length<=ci)row.push('');row[ci]=val;

async function readSheetFile(file){
  const name=file.name||'';
  if(/\.xlsx$/i.test(name)||/spreadsheetml/.test(file.type||'')){
    if(typeof DecompressionStream==='undefined')throw new Error('This browser can’t read Excel files. Save the sheet as a CSV file and upload that instead.');
    return await readXlsx(await file.arrayBuffer());
  }
  if(/\.xls$/i.test(name)){
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
    return wb.SheetNames.map(n=>({name:n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''}).map(r=>r.map(c=>c instanceof Date?c.getFullYear()+'-'+pad(c.getMonth()+1)+'-'+pad(c.getDate()):c))}));
  }
  return[{name:name.replace(/\.[^.]+$/,''),rows:parseCSV(await file.text())}];
}

/* ============ Rota import: reading dates, names and rotas ============ */
const MON3={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function ymd(y,m,d){y=+y;m=+m;d=+d;if(y<100)y+=2000;if(m<1||m>12||d<1||d>31||y<2000||y>2100)return'';const t=new Date(Date.UTC(y,m-1,d));return t.getUTCMonth()===m-1?y+'-'+pad(m)+'-'+pad(d):'';}
function parseAnyDate(v){
  if(v instanceof Date)return ymd(v.getFullYear(),v.getMonth()+1,v.getDate());
  if(typeof v==='number')return v>20000&&v<80000?xlsxSerialToIso(v):'';
  const s=String(v==null?'':v).trim();if(!s)return'';
  let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);if(m)return ymd(m[1],m[2],m[3]);
  m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/);
  if(m){let a=+m[1],b=+m[2];return +b>12&&a<=12?ymd(m[3],a,b):ymd(m[3],b,a);}
  m=s.match(/^(?:[A-Za-z]+,?\s+)?(\d{1,2})(?:st|nd|rd|th)?[\s\-]+([A-Za-z]{3})[A-Za-z]*\.?,?[\s\-]+(\d{2,4})$/);
  if(m&&MON3[m[2].toLowerCase()])return ymd(m[3],MON3[m[2].toLowerCase()],m[1]);
  m=s.match(/^(?:[A-Za-z]+,?\s+)?([A-Za-z]{3})[A-Za-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})$/);
  if(m&&MON3[m[1].toLowerCase()])return ymd(m[3],MON3[m[1].toLowerCase()],m[2]);
  return'';
}
function rotaFromText(t){
  const s=String(t||'').toLowerCase();
  if(/neuro/.test(s))return'NEURO';
  if(/ortho|\bort\b/.test(s))return'ORT';
  if(/medic|\bmed\b|\bmss\b/.test(s))return'MEDICAL';
  if(/surg|\bgs\b|\bsss\b/.test(s))return'SURGICAL';
  if(/pediat|paediat|\bped|child/.test(s))return'PED';
  if(/\bobg\b|obst|gyn|\bobs\b/.test(s))return'OBG';
  if(/emerg|\ber\b|\bed\b|a&e|accident/.test(s))return'EM';
  return'';
}
function normName(s){return String(s||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\b(dr|mr|mrs|ms)\.?\s/g,'').replace(/[.,'’\-]/g,' ').replace(/\s+/g,' ').trim();}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c;}return p[n];}
function buildNameIndex(){
  const exact={},list=[];
  Object.values(S.interns).forEach(it=>{if(!it.name)return;const k=normName(it.name);(exact[k]=exact[k]||[]).push(it.id);list.push({id:it.id,key:k,tokens:k.split(' ')});});
  return{exact,list};
}
function matchIntern(text,idx){
  const k=normName(text);if(!k)return{id:null,reason:''};
  const ex=idx.exact[k];
  if(ex&&ex.length===1)return{id:ex[0]};
  if(ex&&ex.length>1)return{id:null,reason:'Two interns have this name; it can’t be told apart.'};
  const tk=k.split(' '),sub=idx.list.filter(x=>tk.every(t=>x.tokens.includes(t)));
  if(sub.length===1&&tk.length>=2)return{id:sub[0].id};
  let best=null,bd=99;idx.list.forEach(x=>{const d=lev(k,x.key);if(d<bd){bd=d;best=x;}});
  const sug=best&&bd<=Math.max(2,Math.floor(k.length*.22))?S.interns[best.id].name:'';
  return{id:null,reason:sub.length>1?'More than one intern matches this name.':'No intern has this name.',suggest:sug};
}
function splitNames(cell){
  if(cell==null||typeof cell==='number'||typeof cell==='boolean')return[];
  return String(cell).split(/[;\n\r/&+،,]|\s+and\s+/i).map(s=>s.trim()).filter(s=>s&&!/^[-–—.]+$/.test(s));
}
function classifyHeader(h){
  const cols={date:-1,need:-1,rota:-1,skip:[],names:[]};
  h.forEach((c,i)=>{
    const s=String(c==null?'':c).trim();
    if(cols.date<0&&/^(date|التاريخ)\b/i.test(s)){cols.date=i;return;}
    if(/^(week\s*)?day$|^dow$|^weekday$|^note|^comment|^remark|^shift$|^time$/i.test(s)){cols.skip.push(i);return;}
    if(cols.need<0&&/^(needed|need|required|no\.?|count|interns? needed|number)$/i.test(s)){cols.need=i;return;}
    if(cols.rota<0&&/^(rota|department|dept|unit|rotation|service)$/i.test(s)){cols.rota=i;return;}
    cols.names.push(i);
  });
  return cols;
}
function extractRota(sheets){
  const entries=[],notes=[];
  sheets.forEach(sh=>{
    const rows=sh.rows||[];if(!rows.some(r=>r.some(c=>String(c).trim())))return;
    const sheetRota=rotaFromText(sh.name);
    let hr=-1;for(let i=0;i<Math.min(rows.length,15);i++){if(rows[i].some(c=>/^(date|التاريخ)\b/i.test(String(c==null?'':c).trim()))){hr=i;break;}}
    let cols,start;
    if(hr>=0){cols=classifyHeader(rows[hr]);start=hr+1;}
    else{
      const width=Math.max(...rows.map(r=>r.length)),score=Array(width).fill(0);
      rows.slice(0,40).forEach(r=>r.forEach((c,i)=>{if(parseAnyDate(c))score[i]++;}));
      const di=score.indexOf(Math.max(...score));
      if(!(score[di]>=2)){notes.push('Sheet “'+sh.name+'”: no Date column found.');return;}
      cols={date:di,need:-1,rota:-1,skip:[],names:[]};for(let i=0;i<width;i++)if(i!==di)cols.names.push(i);start=0;
    }
    if(cols.date<0){notes.push('Sheet “'+sh.name+'”: no Date column found.');return;}
    let last='';
    for(let i=start;i<rows.length;i++){
      const r=rows[i],names=[];cols.names.forEach(ci=>splitNames(r[ci]).forEach(n=>names.push(n)));
      let date=parseAnyDate(r[cols.date]);
      if(!date){if(names.length&&last)date=last;else{if(names.length||String(r[cols.date]||'').trim())notes.push('Sheet “'+sh.name+'” row '+(i+1)+': the date “'+String(r[cols.date]).trim()+'” was not understood.');continue;}}
      last=date;
      const needRaw=cols.need>=0?r[cols.need]:'',need=needRaw===''||needRaw==null||isNaN(Number(needRaw))?null:Math.max(0,Math.round(Number(needRaw)));
      const hint=(cols.rota>=0?rotaFromText(r[cols.rota]):'')||sheetRota||'';
      if(!names.length&&need==null)continue;
      entries.push({sheet:sh.name,row:i+1,date,need,names,hint,hintText:cols.rota>=0?String(r[cols.rota]||''):''});
    }
  });
  return{entries,notes};
}

/* ============ Rota import: checking against the rules, then saving ============ */
function planRotaImport(entries,mode,defaultRota){
  const idx=buildNameIndex(),saved=S.oncall,sim=clone(S.oncall);
  S.oncall=sim;
  const issues=[],stat={ready:0,skipped:0,warned:0,already:0};const touched=new Set();
  const doc=(rota,ym)=>{const key=ocKey(rota,ym);return sim[key]=sim[key]||{id:key,unit:rota,ym,days:{}};};
  try{
    const ents=entries.map(e=>Object.assign({},e,{rota:e.hint||defaultRota}));
    if(mode==='replace'){
      const seen=new Set();
      ents.forEach(e=>{if(!ONCALL_UNITS.includes(e.rota)||!canRota(e.rota))return;const k=e.rota+e.date;if(seen.has(k))return;seen.add(k);const d=doc(e.rota,ymOf(e.date)),dk=dayKey(e.date);if(d.days[dk])d.days[dk].ids=[];});
    }
    ents.forEach(e=>{
      const where='Row '+e.row+(e.sheet?' of “'+e.sheet+'”':''),label=fmtDate(e.date);
      if(!ONCALL_UNITS.includes(e.rota)){issues.push({lvl:'skip',where,date:label,name:e.names.join(', '),msg:'The rota “'+(e.hintText||'')+'” is not recognised.'});stat.skipped+=e.names.length||1;return;}
      if(!canRota(e.rota)){issues.push({lvl:'skip',where,date:label,name:e.names.join(', '),msg:'You can’t change the '+UNIT_NAME[e.rota]+' rota.'});stat.skipped+=e.names.length||1;return;}
      const d=doc(e.rota,ymOf(e.date)),dk=dayKey(e.date),day=d.days[dk]=d.days[dk]||{need:null,ids:[]};
      day.ids=day.ids||[];touched.add(d.id);
      if(e.need!=null)day.need=e.need;
      e.names.forEach(nm=>{
        const m=matchIntern(nm,idx);
        if(!m.id){issues.push({lvl:'skip',where,date:label,name:nm,msg:m.reason+(m.suggest?' Did you mean “'+m.suggest+'”?':'')});stat.skipped++;return;}
        const ck=assignCheck(e.rota,m.id,e.date);
        if(ck.block.length){
          if(ck.block[0]==='Already on this day.'){stat.already++;return;}
          issues.push({lvl:'skip',where,date:label,name:S.interns[m.id].name,msg:ck.block[0]});stat.skipped++;return;
        }
        day.ids.push(m.id);stat.ready++;
        ck.warn.forEach(w=>{issues.push({lvl:'warn',where,date:label,name:S.interns[m.id].name,msg:w});stat.warned++;});
      });
      if(day.need==null||day.need<day.ids.length)day.need=Math.max(day.need==null?CFG.defaultNeed:day.need,day.ids.length);
    });
  }finally{S.oncall=saved;}
  const docs=[...touched].map(k=>sim[k]);
  return{docs,issues,stat,days:new Set(entries.map(e=>e.date)).size};
}

  const p=S.people[id];if(!p)return;
  const ok=await askConfirm('Delete '+p.name+'?','They will no longer be a coordinator for any rotation.','Delete',true);
  if(!ok)return;closeModal();
  await del('people',id);logEv('Deleted '+p.name);toast('Deleted.');
  if(location.hash.startsWith('#person-'))location.hash='#coordinators';
}
const ACT={
  tab:el=>{UI.tab=el.dataset.v;},
  reqf:el=>{UI.reqF=el.dataset.v;},
  gridmove:el=>{const n=+el.dataset.n,base=UI.gridYm||ymAdd(ymOf(todayStr()),-3);UI.gridYm=n===0?ymAdd(ymOf(todayStr()),-3):ymAdd(base,n);},
  'export-rot':()=>{const months=gridMonths(),rows=[['Name','Group','Contact number','Started'].concat(months.map(fmtYm))];filteredInterns(months).forEach(it=>rows.push([it.name,it.group||'',it.phone,fmtYm(planStart(it))].concat(months.map(m=>{const e=entryAt(it,m);return e?BLOCK_NAME[e.dept]+(e.sub?' - '+e.sub:''):'';}))));return saveCsv('rotations-'+months[0]+'.csv',rows);},
  'export-int':()=>{const rows=[['Name','Group','Contact number','Email','Start month']];shownInterns().forEach(it=>rows.push([it.name,it.group||'',it.phone,it.email||'',planStart(it)]));return saveCsv('interns.csv',rows);},
  'export-oc':()=>{const unit=UI.ocUnit,ym=UI.ocYm,rows=[['Date','Weekday','Weekend or holiday','Interns needed','Interns on call']];for(let d=1;d<=dim(ym);d++){const date=ym+'-'+pad(d),r=dayRec(unit,date);rows.push([date,DAYS[dow(date)],isWkDay(date)?'yes':'',r.need==null?'':r.need,r.ids.map(i=>(S.interns[i]||{}).name).join('; ')]);}return saveCsv('oncall-'+unit+'-'+ym+'.csv',rows);},
  'edit-plan':el=>openPlanEditor(el.dataset.id),
  'pe-tpl':()=>{PE.plan=makePlan(PE.start,+$('pe-tpl').value);paintPE();},
  'pe-save':async()=>{
    const v=validatePlan(PE.plan);if(!v.ok)return;
    const id=PE.id,plan=PE.plan;
    await mut('interns',id,b=>{b.plan=plan;b.startYm=plan[0].ym;return b;});
    logEv('Updated the rotation plan for '+S.interns[id].name);closeModal();toast('Plan saved.');
  },
  close:()=>closeModal(),
  'confirm-yes':()=>{const r=confirmResolve;confirmResolve=null;$('modal').innerHTML='';if(r)r(true);},
  'confirm-no':()=>closeModal(),
  'add-intern':()=>openAddIntern(),
  'edit-intern':el=>openEditIntern(el.dataset.id),
  'intern-save':el=>saveIntern(el.dataset.id||null),
  'intern-del':el=>deleteIntern(el.dataset.id),
  sel:el=>{UI.sel[el.dataset.id]=el.checked;},
  'sel-all':()=>{shownInterns().forEach(it=>UI.sel[it.id]=true);},
  'sel-none':()=>{UI.sel={};},
  'bulk-tpl':()=>openBulkTpl(),
  'bulk-go':()=>runBulkTpl(),
  'bulk-group':()=>openBulkGroup(),
  'bulk-group-go':()=>runBulkGroup(),
  'upload-open':()=>openUpload(),
  'up-parse':()=>{UP.text=$('up-text').value;const a=analyzeSheet(parseCSV(UP.text));UP.items=a.items;UP.errors=a.errors;paintUpload();},
  'up-go':()=>runUpload(),
  'add-person':()=>openPersonForm(null),
  'edit-person':el=>openPersonForm(el.dataset.id),
  'person-save':el=>savePerson(el.dataset.id||null),
  'person-del':el=>deletePerson(el.dataset.id),
  tick:el=>toggleCheck(el.dataset.id,el.dataset.b,el.dataset.k),
  'chk-open':el=>{UI.chkOpen=el.checked;},
  'req-yes':el=>{const r=S.requests[el.dataset.id];if(!r)return;if(r.type==='freeze')openFreezeApprove(r.id);else return decide(r.id,'approved');},
  'req-no':el=>openDecline(el.dataset.id),
  'dc-go':el=>{const note=$('dc-note').value.trim();closeModal();return decide(el.dataset.id,'declined',{note});},
  'fz-go':el=>{const m=Math.round(Number($('fz-m').value));if(!(m>=1&&m<=24))return showErr('Enter a number of months from 1 to 24.');closeModal();return decide(el.dataset.id,'approved',{months:m});},
  'new-leave':()=>openLeaveForm(),
  'new-elective':()=>openElectiveForm(),
  'new-freeze':()=>openFreezeForm(),
  'lv-submit':()=>submitLeave(),
  'el-submit':()=>submitElective(),
  'fr-submit':()=>submitFreeze(),
  ocunit:el=>{UI.ocUnit=el.dataset.u;UI.ocDay=null;},
  ocmonth:el=>{const n=+el.dataset.n;UI.ocYm=n===0?ymOf(todayStr()):ymAdd(UI.ocYm||ymOf(todayStr()),n);UI.ocDay=null;},
  ocday:el=>{UI.ocDay=el.dataset.d;},
  'oc-need':el=>{
    const date=el.dataset.d,unit=UI.ocUnit,d=+el.dataset.n;if(!canRota(unit))return;
    return ocMutate(unit,ymOf(date),days=>{const r=ensureDay(days,date);if(r.need==null)r.need=d>0?CFG.defaultNeed:0;else r.need=Math.max(0,r.need+d);});
  },
  assign:el=>{
    const date=el.dataset.d,id=el.dataset.i,unit=UI.ocUnit;if(!canRota(unit))return;
    const ck=assignCheck(unit,id,date);if(ck.block.length){toast(ck.block[0]);return;}
    logEv('Put '+S.interns[id].name+' on the '+UNIT_NAME[unit]+' rota for '+fmtDate(date));
    return ocMutate(unit,ymOf(date),days=>{const r=ensureDay(days,date);if(!r.ids.includes(id))r.ids.push(id);});
  },
  unassign:el=>{
    const date=el.dataset.d,id=el.dataset.i,unit=UI.ocUnit;if(!canRota(unit))return;
    logEv('Took '+((S.interns[id]||{}).name||'an intern')+' off the '+UNIT_NAME[unit]+' rota for '+fmtDate(date));
    return ocMutate(unit,ymOf(date),days=>{const r=ensureDay(days,date);r.ids=r.ids.filter(x=>x!==id);});
  },
  'hol-add':el=>{const i=$('oc-hol');return toggleHoliday(el.dataset.d,i?i.value.trim():'',true);},
  'hol-del':el=>toggleHoliday(el.dataset.d,'',false),
  'hol-del-setup':el=>toggleHoliday(el.dataset.d,'',false),
  sgmonth:el=>{const n=+el.dataset.n;UI.sgYm=n===0?ymOf(todayStr()):ymAdd(UI.sgYm||ymOf(todayStr()),n);},
  'setup-save':()=>saveSetup(),
  'clear-sample':()=>clearSample(),
  'rota-import':()=>openRotaImport(),
  'ri-go':()=>runRotaImport(),
  'ri-template':()=>rotaTemplate(),
  login:()=>doLogin($('lg-phone').value,$('lg-code').value),
  logout:()=>doLogout(),
  retry:()=>{LOADERR='';return refresh();},
  'view-cert':el=>viewCert(el.dataset.id),
  newcode:el=>{const id=el.dataset.id,col=el.dataset.col;return mut(col,id,b=>{b.accessCode=genCode();return b;}).then(()=>{logEv('Made a new access code for '+((S[col][id]||{}).name||'someone'));toast('New code made. The old one no longer works.');});},
  'export-codes':()=>{const rows=[['Name','Group or role','Contact number','Access code']];Object.values(S.interns).sort((a,b)=>a.name.localeCompare(b.name)).forEach(i=>rows.push([i.name,i.group||'',i.phone,i.accessCode||'']));Object.values(S.people).sort((a,b)=>a.name.localeCompare(b.name)).forEach(p=>rows.push([p.name,ROLE_LABEL[p.role]||p.role,p.phone,p.accessCode||'']));return saveCsv('access-codes.csv',rows);},
  'load-sample':async()=>{try{await call('sample',{mode:'load'});await loadAll();toast('Sample data loaded.');}catch(e){toast(e.message);}},
  endpreview:()=>setPreview(''),
  goissue:el=>{if(el.dataset.tab)UI.tab=el.dataset.tab;if(el.dataset.unit)UI.ocUnit=el.dataset.unit;if(el.dataset.ym)UI.ocYm=el.dataset.ym;}
};
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act;
  if(act==='modalbg'){if(ev.target===el)closeModal();return;}
  const fn=ACT[act];if(!fn)return;
  Promise.resolve().then(()=>fn(el,ev)).catch(e=>{console.error(e);toast('Something went wrong.');}).then(()=>scheduleRender());
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='ri-file'){if(t.files[0])handleRotaFile(t.files[0]);return;}
  if(t.id==='ri-rota'){RI.rota=t.value;paintRI();return;}
  if(t.name==='ri-mode'){RI.mode=t.value;paintRI();return;}
  if(t.dataset&&t.dataset.bind){const k=t.dataset.bind;if(k==='preview')setPreview(t.value);else UI[k]=t.value;scheduleRender();return;}
  if(t.dataset&&t.dataset.peDept!==undefined){const i=+t.dataset.peDept;PE.plan[i].dept=t.value;delete PE.plan[i].sub;paintPE();return;}
  if(t.dataset&&t.dataset.peSub!==undefined){const i=+t.dataset.peSub;if(t.value)PE.plan[i].sub=t.value;else delete PE.plan[i].sub;paintPE();return;}
  if(t.id==='pe-start'){const v=t.value;if(/^\d{4}-\d{2}$/.test(v)){const d=ymIdx(v)-ymIdx(PE.plan[0].ym);PE.plan.forEach(e=>{e.ym=ymAdd(e.ym,d);});PE.start=v;}paintPE();return;}
  if(t.dataset&&t.dataset.sgId){
    const id=t.dataset.sgId,f=t.dataset.sgF,v=t.value;if(!canSurg())return;
    mut('surgery',id,b=>{b=b||{spec:null,orthFirst:false};if(f==='spec')b.spec=v||null;else b.orthFirst=v==='ort';return b;});
    logEv('Set the surgical split for '+((S.interns[id]||{}).name||'an intern'));return;
  }
  if(t.id==='up-file'){if(t.files[0])handleUploadFile(t.files[0]);return;}
  if(t.id==='el-pick'){$('el-other').hidden=t.value!=='__other';return;}
  if(t.closest&&t.closest('#modal')&&((t.id&&t.id.startsWith('lv-'))||t.name==='lv-kind'))updateLeaveMsg();
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='lg-phone'){UI.lPhone=t.value;return;}
  if(t.id==='lg-code'){UI.lCode=t.value;return;}
  if(t.dataset&&t.dataset.bind&&t.tagName==='INPUT'&&(t.type==='search'||t.type==='text'||t.type==='tel')){UI[t.dataset.bind]=t.value;scheduleRender();return;}
  if(t.closest&&t.closest('#modal')&&t.id&&t.id.startsWith('lv-')&&t.id!=='lv-file')updateLeaveMsg();
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&$('modal').innerHTML)closeModal();});
window.addEventListener('hashchange',()=>scheduleRender());

document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&(ev.target.id==='lg-phone'||ev.target.id==='lg-code')){ev.preventDefault();ACT.login();}});
async function init(){
  const c=window.APP_CONFIG||{};
  API.url=String(c.API_URL||'').trim();API.clientId=String(c.GOOGLE_CLIENT_ID||'').trim();
  if(!/^https:\/\/script\.google\.com\//.test(API.url)){API.url='';render();return;}
  try{API.token=localStorage.getItem('ib_token')||null;}catch(e){}
  render();
  if(API.token){try{await loadAll();startPolling();}catch(e){if(e.code!=='unauthorized'){LOADERR=e.message;scheduleRender();}}}
}
init();
</script>
